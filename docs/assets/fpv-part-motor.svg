<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — BRUSHLESS MOTOR ANATOMY</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">The ESC switches current through the motor windings to make the rotor spin</text><g transform="translate(370 300)"><ellipse cx="0" cy="-8" rx="132" ry="135" fill="#394d60" stroke="#b4c8d8" stroke-width="5"/><ellipse cx="0" cy="-8" rx="100" ry="105" fill="#0c1f31" stroke="#f4bd50" stroke-width="6"/><ellipse cx="0" cy="-8" rx="68" ry="72" fill="#8e6a32" stroke="#ffda7f" stroke-width="5"/><ellipse cx="0" cy="-8" rx="38" ry="43" fill="#122a3e" stroke="#51d8eb" stroke-width="5"/><path d="M0 -110 V-178" stroke="#dbe7ef" stroke-width="22"/><path d="M0 -178 v-38" stroke="#f4bd50" stroke-width="10"/><g fill="#d5a345"><rect x="-87" y="-40" width="32" height="64" rx="6"/><rect x="-37" y="-77" width="32" height="67" rx="6"/><rect x="19" y="-72" width="32" height="67" rx="6"/><rect x="58" y="-32" width="32" height="64" rx="6"/></g><path d="M-110 100 L-150 145 M110 100 L150 145" stroke="#9ab0c2" stroke-width="12"/><circle cx="-150" cy="145" r="10" fill="#f3c05b"/><circle cx="150" cy="145" r="10" fill="#f3c05b"/></g><g fill="none" stroke="#6ee7ff" stroke-width="3"><path d="M370 92 V120 H515"/><path d="M457 290 H630"/><path d="M370 460 V475 H585"/><path d="M260 300 H110"/></g><g font-family="Arial"><text x="520" y="113" font-size="21" fill="#6ee7ff">Shaft</text><text x="645" y="296" font-size="21" fill="#6ee7ff">Rotor bell / magnets</text><text x="595" y="483" font-size="21" fill="#6ee7ff">Stator + windings</text><text x="45" y="292" font-size="21" fill="#6ee7ff">Mounting base</text><rect x="660" y="360" width="380" height="118" rx="14" fill="#0a2137" stroke="#337ea0" stroke-width="2"/><text x="685" y="398" font-size="21" fill="#ffd278" font-weight="700">Motor KV is not “power”</text><text x="685" y="429" font-size="18" fill="#fff">KV estimates unloaded RPM per volt.</text><text x="685" y="455" font-size="18" fill="#fff">Match the motor to battery, prop and ESC.</text></g></svg>