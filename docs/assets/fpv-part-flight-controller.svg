<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — FLIGHT CONTROLLER (FC)</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">The onboard computer that runs flight-control firmware</text><g transform="translate(500 300)"><rect x="-155" y="-165" width="310" height="330" rx="20" fill="#1c3d55" stroke="#e8b54b" stroke-width="6"/><g fill="#e8b54b" stroke="#fff" stroke-width="2"><circle cx="-127" cy="-137" r="17"/><circle cx="127" cy="-137" r="17"/><circle cx="-127" cy="137" r="17"/><circle cx="127" cy="137" r="17"/></g><rect x="-85" y="-73" width="170" height="125" rx="12" fill="#0b2032" stroke="#8eb5c6" stroke-width="4"/><text x="0" y="-18" text-anchor="middle" font-family="Arial" font-size="27" fill="#fff" font-weight="700">MCU</text><text x="0" y="18" text-anchor="middle" font-family="Arial" font-size="18" fill="#6ee7ff">Firmware</text><rect x="-50" y="-142" width="100" height="36" rx="7" fill="#d4a341"/><text x="0" y="-118" text-anchor="middle" font-family="Arial" font-size="17" fill="#111d29">GYRO</text><rect x="-80" y="72" width="160" height="45" rx="7" fill="#213d53" stroke="#51d8eb" stroke-width="3"/><text x="0" y="100" text-anchor="middle" font-family="Arial" font-size="19" fill="#fff">UARTs / pads</text><rect x="-47" y="-192" width="94" height="28" rx="6" fill="#b6c7d5"/><text x="0" y="-172" text-anchor="middle" font-family="Arial" font-size="16" fill="#102132">USB</text></g><g stroke="#6ee7ff" stroke-width="3" fill="none"><path d="M345 250 H210"/><path d="M580 175 H750"/><path d="M580 390 H750"/></g><g font-family="Arial" fill="#fff"><text x="45" y="235" font-size="22" fill="#6ee7ff">USB port</text><text x="45" y="265" font-size="18">Connects to configurator</text><text x="765" y="169" font-size="22" fill="#6ee7ff">MCU + gyro</text><text x="765" y="199" font-size="18">Processes commands</text><text x="765" y="384" font-size="22" fill="#6ee7ff">I/O pads / UARTs</text><text x="765" y="414" font-size="18">Receiver, ESC, GPS, video</text></g><rect x="45" y="505" width="1010" height="70" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="68" y="546" font-family="Arial" font-size="19" fill="#fff">Always use the exact board revision's wiring diagram, firmware target and pinout.</text></svg>