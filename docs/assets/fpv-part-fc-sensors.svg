<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6ee7ff"/></marker></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" fill="#fff" font-weight="700">PART 5 — FLIGHT CONTROLLER &amp; SENSORS</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Measure movement, compare with requested movement, correct motor outputs</text><rect x="80" y="170" width="270" height="185" rx="18" fill="#1d3347" stroke="#7af2c2" stroke-width="4"/><rect x="145" y="220" width="140" height="76" rx="10" fill="#c99737" stroke="#fff" stroke-width="3"/><text x="215" y="250" text-anchor="middle" font-family="Arial" font-size="23" fill="#101d2b" font-weight="700">Gyro</text><text x="215" y="277" text-anchor="middle" font-family="Arial" font-size="17" fill="#101d2b">Rotation rate</text><g font-family="Arial" fill="#fff"><text x="215" y="197" text-anchor="middle" font-size="24" font-weight="700">Sensor data</text><text x="215" y="329" text-anchor="middle" font-size="17">Accelerometer helps</text><text x="215" y="349" text-anchor="middle" font-size="17">self-level modes</text></g><path d="M350 260 H450" stroke="#6ee7ff" stroke-width="5" marker-end="url(#a)"/><rect x="465" y="170" width="250" height="185" rx="18" fill="#1d3347" stroke="#6ee7ff" stroke-width="4"/><rect x="530" y="225" width="120" height="75" rx="8" fill="#e3b34c"/><g fill="#182738"><circle cx="546" cy="240" r="5"/><circle cx="634" cy="240" r="5"/><circle cx="546" cy="286" r="5"/><circle cx="634" cy="286" r="5"/></g><text x="590" y="203" text-anchor="middle" font-family="Arial" font-size="24" fill="#fff" font-weight="700">FC firmware</text><text x="590" y="333" text-anchor="middle" font-family="Arial" font-size="17" fill="#aeeefa">PID / mixer</text><path d="M715 260 H820" stroke="#6ee7ff" stroke-width="5" marker-end="url(#a)"/><rect x="835" y="185" width="185" height="155" rx="18" fill="#1d3347" stroke="#ffbe5c" stroke-width="4"/><g stroke="#ffbe5c" stroke-width="5"><path d="M865 219 h125 M865 242 h125 M865 265 h125 M865 288 h125"/></g><text x="927" y="314" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff" font-weight="700">ESC → motors</text><path d="M925 350 V400 H215 V360" fill="none" stroke="#7af2c2" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="570" y="390" text-anchor="middle" font-family="Arial" font-size="19" fill="#7af2c2">Feedback: the gyro measures the result</text><rect x="40" y="465" width="1020" height="105" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="63" y="501" font-family="Arial" font-size="21" fill="#ffd278" font-weight="700">Remember</text><text x="63" y="533" font-family="Arial" font-size="19" fill="#fff">Gyro supports fast stabilization. GPS is slower position/speed information and does not replace the gyro.</text></svg>