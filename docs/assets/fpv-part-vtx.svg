<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — VTX / DIGITAL AIR UNIT</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Aircraft-side hardware transmits camera video to the compatible ground system</text><g transform="translate(390 285)"><rect x="-160" y="-105" width="320" height="210" rx="18" fill="#1a3549" stroke="#e8b54b" stroke-width="5"/><rect x="-115" y="-60" width="230" height="120" rx="10" fill="#0b1f31" stroke="#51d8eb" stroke-width="4"/><rect x="-75" y="-28" width="150" height="55" rx="6" fill="#435d71"/><text x="0" y="7" text-anchor="middle" font-family="Arial" font-size="28" fill="#fff" font-weight="700">VTX</text><path d="M0 -105 V-170" stroke="#51d8eb" stroke-width="8"/><path d="M0 -177 q27 15 0 30 q-27 15 0 30" fill="none" stroke="#6ee7ff" stroke-width="5"/></g><g font-family="Arial" fill="#fff"><path d="M550 220 H690" stroke="#6ee7ff" stroke-width="3"/><text x="710" y="215" fill="#6ee7ff" font-size="22">Antenna connector</text><text x="710" y="245" font-size="18">Attach the right antenna</text><path d="M550 330 H690" stroke="#6ee7ff" stroke-width="3"/><text x="710" y="325" fill="#6ee7ff" font-size="22">Input / FC connection</text><text x="710" y="355" font-size="18">Video, configuration and power</text><rect x="45" y="490" width="1010" height="82" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="68" y="525" font-size="20" fill="#ffd278" font-weight="700">Never assume any VTX works with any goggles</text><text x="68" y="553" font-size="18" fill="#fff">Confirm video ecosystem, band/channel, legal power limits, cooling, power range and required antenna.</text></g></svg>