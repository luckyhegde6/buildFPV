<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
<title id="title">GPS data flow to flight controller</title><desc id="desc">Satellites send signals to the GPS antenna and GNSS receiver. The GPS receiver sends serial position and speed data through a UART to a flight controller. The flight controller keeps using its gyro for fast stabilisation; GPS supports higher-level navigation and OSD functions when configured.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1080" height="300" rx="18" fill="#f8fafc"/>
<text x="26" y="35" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">GPS/GNSS data path (simplified)</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="30" y="76" width="225" height="126" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="142" y="108" font-size="21" font-weight="bold" fill="#1e3a8a">Satellites</text>
<text x="142" y="137" font-size="15" fill="#1e3a8a">GNSS constellations</text>
<text x="142" y="159" font-size="15" fill="#1e3a8a">send timing signals</text>
<text x="142" y="181" font-size="15" fill="#1e3a8a">toward the receiver</text>
<rect x="315" y="76" width="230" height="126" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="430" y="108" font-size="21" font-weight="bold" fill="#166534">GPS / GNSS module</text>
<text x="430" y="137" font-size="15" fill="#166534">calculates position,</text>
<text x="430" y="159" font-size="15" fill="#166534">ground speed and</text>
<text x="430" y="181" font-size="15" fill="#166534">satellite-fix data</text>
<rect x="605" y="76" width="180" height="126" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="695" y="108" font-size="21" font-weight="bold" fill="#9a3412">UART</text>
<text x="695" y="137" font-size="15" fill="#9a3412">serial data</text>
<text x="695" y="159" font-size="15" fill="#9a3412">GPS TX → FC RX</text>
<text x="695" y="181" font-size="15" fill="#9a3412">and shared GND</text>
<rect x="845" y="76" width="205" height="126" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
<text x="947" y="108" font-size="21" font-weight="bold" fill="#6b21a8">Flight controller</text>
<text x="947" y="137" font-size="15" fill="#6b21a8">OSD / logging /</text>
<text x="947" y="159" font-size="15" fill="#6b21a8">supported Rescue</text>
<text x="947" y="181" font-size="15" fill="#6b21a8">when configured</text>
<path d="M255 139 H309" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/>
<path d="M545 139 H599" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/>
<path d="M785 139 H839" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/>
<rect x="170" y="231" width="740" height="45" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="540" y="258" font-size="16" fill="#334155">GPS is slower navigation data — the gyro remains central to fast attitude stabilisation.</text>
</g></svg>