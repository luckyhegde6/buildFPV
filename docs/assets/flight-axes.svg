<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Throttle, roll, pitch and yaw on a quadcopter</title><desc id="desc">Four panels show throttle as total thrust, roll as rotation around the nose-tail axis, pitch as nose up/down rotation, and yaw as nose left/right rotation.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="390" rx="22" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Four primary controls</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(24,64)"><rect width="276" height="292" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="138" y="35" font-size="22" font-weight="bold" fill="#1e40af">THROTTLE</text><text x="138" y="61" font-size="15" fill="#1e3a8a">More / less total thrust</text><rect x="53" y="105" width="170" height="68" rx="12" fill="#93c5fd"/><text x="138" y="145" font-size="20" font-weight="bold" fill="#1e3a8a">QUAD</text><path d="M138 100 V78" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M138 180 V202" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="138" y="236" font-size="15" fill="#1e3a8a">Increase overall thrust</text><text x="138" y="257" font-size="15" fill="#1e3a8a">to climb, if vertical thrust</text><text x="138" y="278" font-size="15" fill="#1e3a8a">exceeds weight.</text></g>
<g transform="translate(322,64)"><rect width="276" height="292" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="138" y="35" font-size="22" font-weight="bold" fill="#166534">ROLL</text><text x="138" y="61" font-size="15" fill="#166534">Tilt left / right</text><rect x="53" y="105" width="170" height="68" rx="12" fill="#86efac"/><path d="M58 123 L218 155" stroke="#166534" stroke-width="6"/><circle cx="138" cy="139" r="8" fill="#166534"/><path d="M70 96 Q138 55 206 96" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="138" y="220" font-size="15" fill="#166534">Left-vs-right thrust</text><text x="138" y="242" font-size="15" fill="#166534">difference rotates the</text><text x="138" y="264" font-size="15" fill="#166534">aircraft about its nose-tail</text><text x="138" y="284" font-size="15" fill="#166534">axis.</text></g>
<g transform="translate(620,64)"><rect width="276" height="292" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="138" y="35" font-size="22" font-weight="bold" fill="#9a3412">PITCH</text><text x="138" y="61" font-size="15" fill="#9a3412">Nose forward / backward</text><rect x="53" y="105" width="170" height="68" rx="12" fill="#fdba74"/><path d="M70 153 L206 119" stroke="#9a3412" stroke-width="6"/><circle cx="138" cy="136" r="8" fill="#9a3412"/><path d="M73 92 Q138 55 203 92" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#a)"/><text x="138" y="220" font-size="15" fill="#9a3412">Front-vs-rear thrust</text><text x="138" y="242" font-size="15" fill="#9a3412">difference rotates the</text><text x="138" y="264" font-size="15" fill="#9a3412">aircraft about its side-to-</text><text x="138" y="284" font-size="15" fill="#9a3412">side axis.</text></g>
<g transform="translate(918,64)"><rect width="258" height="292" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="129" y="35" font-size="22" font-weight="bold" fill="#6b21a8">YAW</text><text x="129" y="61" font-size="15" fill="#6b21a8">Rotate nose left / right</text><rect x="45" y="105" width="168" height="68" rx="12" fill="#d8b4fe"/><text x="129" y="145" font-size="20" font-weight="bold" fill="#6b21a8">TOP VIEW</text><path d="M63 97 C45 65 85 52 105 70" fill="none" stroke="#9333ea" stroke-width="4" marker-end="url(#a)"/><path d="M195 180 C214 214 175 226 154 207" fill="none" stroke="#9333ea" stroke-width="4" marker-end="url(#a)"/><text x="129" y="236" font-size="15" fill="#6b21a8">Changes the torque balance</text><text x="129" y="258" font-size="15" fill="#6b21a8">between CW and CCW</text><text x="129" y="280" font-size="15" fill="#6b21a8">motor groups.</text></g>
</g></svg>