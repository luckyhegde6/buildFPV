<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Radio control link with ExpressLRS</title><desc id="desc">An enlarged signal path from radio transmitter through the radio link and receiver to the flight controller.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1684d8"/></marker></defs><rect width="1400" height="620" rx="28" fill="#f5f9fd"/><rect width="1400" height="100" rx="28" fill="#092b4c"/><rect y="72" width="1400" height="28" fill="#092b4c"/><text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">RADIO CONTROL LINK — EXPRESSLRS</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Stick commands reach the flight controller over a separate radio link</text>
<g font-family="Arial,sans-serif">
<rect x="50" y="180" width="280" height="265" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="110" y="225" width="160" height="100" rx="20" fill="#293e54" stroke="#0d1c2c" stroke-width="5"/><circle cx="150" cy="267" r="22" fill="#5b778e" stroke="#d5e0e9" stroke-width="4"/><circle cx="230" cy="267" r="22" fill="#5b778e" stroke="#d5e0e9" stroke-width="4"/><path d="M150 267 L162 253 M230 267 L242 253" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M190 225 L182 190" stroke="#334b61" stroke-width="7"/><text x="190" y="375" text-anchor="middle" font-size="28" font-weight="700" fill="#123b5b">Radio transmitter</text><text x="190" y="411" text-anchor="middle" font-size="21" fill="#405f78">Your stick input</text>
<rect x="430" y="180" width="300" height="265" rx="22" fill="#e7f4ff" stroke="#a6cfe8" stroke-width="3"/><text x="580" y="230" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">RF link</text><g fill="none" stroke="#1684d8" stroke-width="8" stroke-linecap="round"><path d="M520 270 C475 300 475 338 520 370"/><path d="M570 250 C505 300 505 338 570 390"/><path d="M635 270 C680 300 680 338 635 370"/><path d="M585 250 C650 300 650 338 585 390"/></g><text x="580" y="415" text-anchor="middle" font-size="23" fill="#315874">ELRS is one open link option</text>
<rect x="830" y="180" width="220" height="265" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="885" y="245" width="110" height="82" rx="12" fill="#1d684b" stroke="#0d4932" stroke-width="4"/><rect x="907" y="262" width="66" height="46" rx="7" fill="#dec05c"/><path d="M885 286 L845 258 M995 286 L1032 258" stroke="#b9c5cf" stroke-width="6"/><text x="940" y="375" text-anchor="middle" font-size="28" font-weight="700" fill="#123b5b">Receiver</text><text x="940" y="411" text-anchor="middle" font-size="21" fill="#405f78">On the drone</text>
<rect x="1130" y="180" width="220" height="265" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="1175" y="240" width="130" height="95" rx="12" fill="#243e56" stroke="#0d1c2c" stroke-width="5"/><rect x="1210" y="262" width="60" height="48" rx="8" fill="#d8aa47"/><text x="1240" y="375" text-anchor="middle" font-size="28" font-weight="700" fill="#123b5b">Flight controller</text><text x="1240" y="411" text-anchor="middle" font-size="21" fill="#405f78">Decodes commands</text>
<g stroke="#1684d8" stroke-width="7" marker-end="url(#a)"><path d="M330 308 H420"/><path d="M730 308 H820"/><path d="M1050 308 H1120"/></g>
<rect x="52" y="490" width="1296" height="78" rx="18" fill="#dceffb"/><text x="76" y="523" font-size="23" font-weight="700" fill="#123b5b">Compatibility check</text><text x="76" y="552" font-size="21" fill="#315874">Radio protocol / firmware, receiver wiring, antenna placement and region-appropriate band must match. Receiver protocol shown is illustrative.</text>
</g></svg>