<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">FPV motors and propellers</title><desc id="desc">Comparison of brushless motors and two, three and four blade propeller types, with notes on KV and pitch.</desc>
<rect width="1400" height="660" rx="28" fill="#f5f9fd"/><rect width="1400" height="100" rx="28" fill="#082a4c"/><rect y="72" width="1400" height="28" fill="#082a4c"/><text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">MOTORS &amp; PROPELLERS</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Motor size / KV and propeller geometry work together</text>
<g font-family="Arial,sans-serif">
<rect x="36" y="130" width="430" height="465" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><text x="251" y="176" font-size="30" font-weight="700" fill="#123b5b" text-anchor="middle">Brushless motor</text>
<g transform="translate(250 316)"><rect x="-72" y="-62" width="144" height="150" rx="24" fill="#223a51" stroke="#091827" stroke-width="6"/><ellipse cx="0" cy="-59" rx="72" ry="24" fill="#384f65" stroke="#091827" stroke-width="6"/><circle cx="0" cy="-60" r="24" fill="#bd303d" stroke="#e85d60" stroke-width="5"/><path d="M0 -85 L0 -127" stroke="#b3c0cc" stroke-width="11" stroke-linecap="round"/><path d="M-49 88 L-49 110 M49 88 L49 110" stroke="#bd9a5d" stroke-width="12" stroke-linecap="round"/></g>
<text x="65" y="452" font-size="22" fill="#294b67">• Stator + magnets create rotation</text><text x="65" y="487" font-size="22" fill="#294b67">• Motor size is given by stator dimensions</text><text x="65" y="522" font-size="22" fill="#294b67">• KV ≈ RPM per volt with no load</text><text x="65" y="557" font-size="22" fill="#294b67">• Higher KV is not automatically better</text>
<rect x="490" y="130" width="874" height="465" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><text x="927" y="176" font-size="30" font-weight="700" fill="#123b5b" text-anchor="middle">Propeller blade count</text>
