<g transform="translate(927 310)"><circle r="18" fill="#293f54"/><path d="M0 -18 C-20 -90 18 -138 38 -155 C52 -125 48 -60 18 -10 Z" fill="#38a8a9" stroke="#217879" stroke-width="3"/><path d="M-15 10 C-90 28 -138 -8 -155 -28 C-125 -42 -60 -38 -10 -8 Z" fill="#38a8a9" stroke="#217879" stroke-width="3"/><path d="M15 8 C65 65 52 125 35 155 C4 133 -22 75 -18 20 Z" fill="#38a8a9" stroke="#217879" stroke-width="3"/></g>
<g transform="translate(1200 310)"><circle r="18" fill="#293f54"/><g fill="#cf6e89" stroke="#8c3c55" stroke-width="3"><path d="M0 -18 C-18 -73 14 -114 31 -135 C46 -106 38 -60 17 -10 Z"/><path d="M-15 -7 C-71 -25 -112 3 -135 20 C-106 36 -60 27 -10 12 Z"/><path d="M-12 12 C-48 60 -36 106 -17 135 C9 111 15 59 6 13 Z"/><path d="M14 12 C60 48 106 36 135 17 C111 -9 59 -15 13 -6 Z"/></g></g>
<g fill="#123b5b" font-size="25" font-weight="700" text-anchor="middle"><text x="650" y="500">3-blade</text><text x="927" y="500">3-blade</text><text x="1200" y="500">4-blade</text></g><g fill="#294b67" font-size="21" text-anchor="middle"><text x="650" y="535">Common balance</text><text x="927" y="535">Smooth thrust</text><text x="1200" y="535">More grip / drag</text></g><text x="514" y="576" font-size="19" fill="#607b90">Match diameter, pitch, motor KV, battery voltage and frame clearance. Always check the prop's rotation direction.</text>
