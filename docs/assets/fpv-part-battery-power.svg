<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6ee7ff"/></marker></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" fill="#fff" font-weight="700">PART 2 — BATTERY &amp; POWER</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Energy source → distribution → the correct voltage for each device</text><rect x="70" y="170" width="260" height="160" rx="18" fill="#222f3c" stroke="#ffbf51" stroke-width="5"/><rect x="93" y="195" width="214" height="110" rx="9" fill="#131e29" stroke="#718ba0" stroke-width="2"/><text x="200" y="240" text-anchor="middle" font-family="Arial" font-size="32" fill="#ffd278" font-weight="700">LiPo</text><text x="200" y="274" text-anchor="middle" font-family="Arial" font-size="21" fill="#fff">3S / 4S / 6S</text><path d="M330 250 H425" stroke="#6ee7ff" stroke-width="5" marker-end="url(#a)"/><rect x="440" y="185" width="220" height="130" rx="14" fill="#1d3347" stroke="#6ee7ff" stroke-width="4"/><text x="550" y="235" text-anchor="middle" font-family="Arial" font-size="24" fill="#fff" font-weight="700">ESC / PDB</text><text x="550" y="271" text-anchor="middle" font-family="Arial" font-size="18" fill="#aeeefa">Power distribution</text><path d="M660 250 H750 V165 H800 M750 250 V300 H800 M750 300 V405 H800" fill="none" stroke="#6ee7ff" stroke-width="4"/><g fill="#123c59" stroke="#83e8f7" stroke-width="3"><rect x="800" y="126" width="230" height="75" rx="12"/><rect x="800" y="261" width="230" height="75" rx="12"/><rect x="800" y="366" width="230" height="75" rx="12"/></g><g fill="#fff" font-family="Arial" text-anchor="middle"><text x="915" y="158" font-size="21" font-weight="700">Motors</text><text x="915" y="185" font-size="16">High current</text><text x="915" y="293" font-size="21" font-weight="700">Flight controller</text><text x="915" y="320" font-size="16">Use specified input</text><text x="915" y="398" font-size="21" font-weight="700">Receiver / Video</text><text x="915" y="425" font-size="16">Regulated voltage if needed</text></g><rect x="36" y="485" width="1028" height="92" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="60" y="520" font-family="Arial" font-size="21" fill="#ffd278" font-weight="700">Safety before power-up</text><text x="60" y="552" font-family="Arial" font-size="19" fill="#fff">Check polarity and voltage range in each exact manual. Disconnect the LiPo before soldering. Never trust connector shape alone.</text></svg>