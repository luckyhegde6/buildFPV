<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc">
<title id="title">FPV live view versus recording pipeline</title>
<desc id="desc">A video camera feed branches to live pilot view via VTX and goggles, and separately to supported onboard recording. A receiver-side DVR records the received display feed; live-view and recording specifications are separate.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#18475c"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c7f1ff"/></marker></defs><rect width="1400" height="740" rx="26" fill="url(#bg)"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">LIVE FPV VIEW ≠ RECORDED VIDEO</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">The live link and every recording path have different capabilities and compatibility.</text>
<g font-family="Arial,sans-serif" stroke="#c7f1ff" stroke-width="4" fill="none" marker-end="url(#arr)">
<path d="M285 300 H355"/><path d="M560 300 H625"/><path d="M820 300 H890"/><path d="M1065 300 H1120"/><path d="M455 342 V476 H550"/><path d="M990 342 V476 H1090"/>
</g>
<g font-family="Arial,sans-serif">
<rect x="52" y="244" width="233" height="112" rx="16" fill="#1b3a53" stroke="#7dd3fc" stroke-width="3"/><text x="168" y="284" text-anchor="middle" font-size="23" font-weight="700" fill="#7dd3fc">Camera</text><text x="168" y="315" text-anchor="middle" font-size="17" fill="#e5f3fb">sensor + lens</text>
<rect x="355" y="244" width="205" height="112" rx="16" fill="#1b3a53" stroke="#7dd3fc" stroke-width="3"/><text x="457" y="284" text-anchor="middle" font-size="23" font-weight="700" fill="#7dd3fc">VTX / air unit</text><text x="457" y="315" text-anchor="middle" font-size="17" fill="#e5f3fb">encodes/transmits</text>
<rect x="625" y="244" width="195" height="112" rx="16" fill="#1b3a53" stroke="#7dd3fc" stroke-width="3"/><text x="722" y="284" text-anchor="middle" font-size="23" font-weight="700" fill="#7dd3fc">RF link</text><text x="722" y="315" text-anchor="middle" font-size="17" fill="#e5f3fb">antenna / channel</text>
<rect x="890" y="244" width="175" height="112" rx="16" fill="#1b3a53" stroke="#7dd3fc" stroke-width="3"/><text x="977" y="284" text-anchor="middle" font-size="23" font-weight="700" fill="#7dd3fc">VRX / goggles</text><text x="977" y="315" text-anchor="middle" font-size="17" fill="#e5f3fb">live pilot view</text>
<rect x="1120" y="244" width="224" height="112" rx="16" fill="#1b3a53" stroke="#7dd3fc" stroke-width="3"/><text x="1232" y="284" text-anchor="middle" font-size="22" font-weight="700" fill="#7dd3fc">Live display</text><text x="1232" y="315" text-anchor="middle" font-size="17" fill="#e5f3fb">mode/latency vary</text>
<rect x="550" y="452" width="360" height="112" rx="16" fill="#14463e" stroke="#86efac" stroke-width="3"/><text x="730" y="490" text-anchor="middle" font-size="22" font-weight="700" fill="#86efac">Onboard recording</text><text x="730" y="520" text-anchor="middle" font-size="17" fill="#e5f3fb">Only if this air unit supports it</text>
<rect x="910" y="452" width="390" height="112" rx="16" fill="#49351d" stroke="#fbd38d" stroke-width="3"/><text x="1105" y="490" text-anchor="middle" font-size="22" font-weight="700" fill="#fbd38d">Goggle / VRX DVR</text><text x="1105" y="520" text-anchor="middle" font-size="17" fill="#e5f3fb">Records received/display feed</text>
<text x="68" y="180" font-size="18" fill="#fff">Video path</text><text x="68" y="605" font-size="18" fill="#c7f9ff">Important: onboard recording may be higher resolution than live-view transmission. DVR may include reception artefacts/OSD and has separate card/settings limits.</text>
<rect x="48" y="632" width="1304" height="66" rx="14" fill="#0a2033" stroke="#44758a" stroke-width="2"/><text x="72" y="671" font-size="19" font-weight="700" fill="#fbd38d">Check each exact model for sensor, lens/FOV, live resolution/fps, latency test conditions, recording mode and storage support.</text>
</g></svg>