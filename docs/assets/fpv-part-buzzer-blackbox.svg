<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — BUZZER &amp; BLACKBOX LOGGING</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Small accessories help recover the quad and troubleshoot issues</text><g transform="translate(285 275)"><circle r="94" fill="#1c3549" stroke="#a9bdcb" stroke-width="5"/><circle r="61" fill="#121f2d" stroke="#6ee7ff" stroke-width="5"/><circle r="34" fill="#354c5d" stroke="#a9bdcb" stroke-width="3"/><circle r="8" fill="#071a2e"/><path d="M-28 -101 l-18 -45 M28 -101 l18 -45" stroke="#f4bd50" stroke-width="7"/><text x="0" y="140" text-anchor="middle" font-family="Arial" font-size="23" fill="#fff" font-weight="700">Buzzer / beeper</text><text x="0" y="169" text-anchor="middle" font-family="Arial" font-size="18" fill="#aeeefa">Audible locating alerts</text></g><g transform="translate(790 270)"><rect x="-135" y="-92" width="270" height="184" rx="20" fill="#1d3a51" stroke="#e6b34d" stroke-width="5"/><rect x="-92" y="-52" width="184" height="104" rx="9" fill="#0a1d2c" stroke="#6ee7ff" stroke-width="3"/><path d="M-70 20 L-36 -8 L-6 12 L28 -22 L70 -4" fill="none" stroke="#7af2c2" stroke-width="5"/><text x="0" y="130" text-anchor="middle" font-family="Arial" font-size="23" fill="#fff" font-weight="700">Blackbox / logs</text><text x="0" y="159" text-anchor="middle" font-family="Arial" font-size="18" fill="#aeeefa">Motion/control data</text></g><rect x="45" y="490" width="1010" height="82" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="68" y="525" font-family="Arial" font-size="20" fill="#ffd278" font-weight="700">Use the correct wiring instructions</text><text x="68" y="553" font-family="Arial" font-size="18" fill="#fff">Some buzzers are self-powered; others rely on the FC/battery. Logging features depend on the FC model and firmware.</text></svg>