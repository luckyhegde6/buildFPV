<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">FPV video system camera to goggles</title><desc id="desc">An enlarged overview of the camera, video transmitter or digital air unit, antenna, radio video link and receiver goggles.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1684d8"/></marker></defs>
<rect width="1400" height="660" rx="28" fill="#f4f9fd"/><rect width="1400" height="100" rx="28" fill="#0a2b4b"/><rect y="72" width="1400" height="28" fill="#0a2b4b"/>
<text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">FPV VIDEO LINK — CAMERA TO GOGGLES</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">The video link is separate from the radio-control link</text>
<g font-family="Arial,sans-serif">
<rect x="40" y="180" width="260" height="260" rx="24" fill="#fff" stroke="#b7cddd" stroke-width="3"/><rect x="90" y="230" width="160" height="105" rx="15" fill="#243e56"/><circle cx="170" cy="281" r="39" fill="#061725" stroke="#e1f2ff" stroke-width="8"/><circle cx="170" cy="281" r="20" fill="#1477b8"/><text x="170" y="378" text-anchor="middle" font-size="28" font-weight="700" fill="#123b5b">FPV camera</text><text x="170" y="414" text-anchor="middle" font-size="21" fill="#405f78">Captures live video</text>
<rect x="376" y="180" width="260" height="260" rx="24" fill="#fff" stroke="#b7cddd" stroke-width="3"/><rect x="433" y="238" width="146" height="100" rx="14" fill="#1e3c57" stroke="#46728f" stroke-width="5"/><rect x="455" y="259" width="48" height="55" rx="7" fill="#d8aa47"/><rect x="518" y="259" width="39" height="55" rx="7" fill="#44aca2"/><path d="M506 238 L522 205" stroke="#334d65" stroke-width="8"/><text x="506" y="378" text-anchor="middle" font-size="28" font-weight="700" fill="#123b5b">VTX / air unit</text><text x="506" y="414" text-anchor="middle" font-size="21" fill="#405f78">Transmits video</text>
<rect x="712" y="180" width="260" height="260" rx="24" fill="#fff" stroke="#b7cddd" stroke-width="3"/><path d="M840 337 L840 230" stroke="#2f4b64" stroke-width="10" stroke-linecap="round"/><circle cx="840" cy="215" r="18" fill="#19a5a5"/><path d="M792 253 C750 290 750 318 792 349 M888 253 C930 290 930 318 888 349" fill="none" stroke="#1684d8" stroke-width="7" stroke-linecap="round"/><text x="842" y="378" text-anchor="middle" font-size="28" font-weight="700" fill="#123b5b">Video antenna</text><text x="842" y="414" text-anchor="middle" font-size="21" fill="#405f78">Radiates video signal</text>
<rect x="1048" y="180" width="312" height="260" rx="24" fill="#fff" stroke="#b7cddd" stroke-width="3"/><path d="M1115 250 Q1200 190 1285 250 L1275 325 Q1200 366 1125 325 Z" fill="#233e58" stroke="#102337" stroke-width="6"/><rect x="1150" y="252" width="100" height="52" rx="10" fill="#9ed2ef"/><path d="M1160 292 l20 -22 l20 16 l24 -24 l24 30" fill="none" stroke="#1677b6" stroke-width="5"/><text x="1204" y="378" text-anchor="middle" font-size="28" font-weight="700" fill="#123b5b">VRX / goggles</text><text x="1204" y="414" text-anchor="middle" font-size="21" fill="#405f78">Receives and displays video</text>
<g stroke="#1684d8" stroke-width="7" marker-end="url(#a)"><path d="M300 302 H366"/><path d="M636 302 H702"/><path d="M972 302 H1038"/></g>
<rect x="52" y="500" width="628" height="100" rx="20" fill="#e0f1ff" stroke="#a9cfe8" stroke-width="2"/><text x="76" y="538" font-size="25" font-weight="700" fill="#123b5b">Analogue (e.g. 5.8 GHz)</text><text x="76" y="573" font-size="22" fill="#315874">Often low-latency; image quality is typically lower.</text>
<rect x="712" y="500" width="628" height="100" rx="20" fill="#e2f8ef" stroke="#a7d8c5" stroke-width="2"/><text x="736" y="538" font-size="25" font-weight="700" fill="#12573e">Digital (DJI / Walksnail / HDZero)</text><text x="736" y="573" font-size="22" fill="#315874">System-specific latency, recording, range and compatibility.</text>
<text x="52" y="634" font-size="18" fill="#607b90">Match VTX / air-unit, receiver, antenna connector and supported system. Do not power a VTX without its required antenna/load.</text>
