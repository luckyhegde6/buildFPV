<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">How the FPV drone control loop works</title><desc id="desc">An enlarged vector diagram of radio input through receiver and flight controller to ESCs, motors and propellers, with sensor feedback.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1880d8"/></marker></defs>
<rect width="1400" height="700" rx="28" fill="#f4f8fc"/><rect width="1400" height="100" rx="28" fill="#092b4c"/><rect y="72" width="1400" height="28" fill="#092b4c"/>
<text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">THE CONTROL LOOP</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Inputs → computation → motor output → sensor feedback</text>
<g font-family="Arial,sans-serif">
<g><rect x="34" y="170" width="220" height="190" rx="20" fill="#e5f3ff" stroke="#95bfdc" stroke-width="3"/><text x="144" y="212" text-anchor="middle" font-size="26" font-weight="700" fill="#123b5d">1. Radio</text><text x="144" y="250" text-anchor="middle" font-size="22" fill="#234b69">Stick inputs</text><text x="144" y="282" text-anchor="middle" font-size="20" fill="#234b69">Throttle / yaw</text><text x="144" y="312" text-anchor="middle" font-size="20" fill="#234b69">pitch / roll</text></g>
<g><rect x="300" y="170" width="220" height="190" rx="20" fill="#e5f3ff" stroke="#95bfdc" stroke-width="3"/><text x="410" y="212" text-anchor="middle" font-size="26" font-weight="700" fill="#123b5d">2. Receiver</text><text x="410" y="250" text-anchor="middle" font-size="22" fill="#234b69">Receives the</text><text x="410" y="282" text-anchor="middle" font-size="22" fill="#234b69">radio link</text><text x="410" y="312" text-anchor="middle" font-size="20" fill="#234b69">ELRS / SBUS*</text></g>
<g><rect x="566" y="150" width="270" height="230" rx="20" fill="#fef2cb" stroke="#d4ae4a" stroke-width="4"/><text x="701" y="194" text-anchor="middle" font-size="27" font-weight="700" fill="#563f0a">3. Flight controller</text><text x="701" y="236" text-anchor="middle" font-size="22" fill="#624b17">Reads commands + sensors</text><text x="701" y="269" text-anchor="middle" font-size="22" fill="#624b17">Runs stabilization / PID</text><text x="701" y="302" text-anchor="middle" font-size="22" fill="#624b17">Calculates motor outputs</text><text x="701" y="345" text-anchor="middle" font-size="19" fill="#765d20">Betaflight is one example</text></g>
<g><rect x="884" y="170" width="210" height="190" rx="20" fill="#e9f8ec" stroke="#8dc79a" stroke-width="3"/><text x="989" y="212" text-anchor="middle" font-size="26" font-weight="700" fill="#16512b">4. ESCs</text><text x="989" y="250" text-anchor="middle" font-size="22" fill="#225c34">Convert signals</text><text x="989" y="282" text-anchor="middle" font-size="22" fill="#225c34">to motor power</text><text x="989" y="312" text-anchor="middle" font-size="20" fill="#225c34">PWM / DShot*</text></g>
<g><rect x="1142" y="170" width="220" height="190" rx="20" fill="#e9f8ec" stroke="#8dc79a" stroke-width="3"/><text x="1252" y="212" text-anchor="middle" font-size="26" font-weight="700" fill="#16512b">5. Motors + props</text><text x="1252" y="250" text-anchor="middle" font-size="22" fill="#225c34">Change speed</text><text x="1252" y="282" text-anchor="middle" font-size="22" fill="#225c34">create thrust</text><text x="1252" y="312" text-anchor="middle" font-size="20" fill="#225c34">move the quad</text></g>
<g stroke="#1880d8" stroke-width="7" marker-end="url(#arrow)"><path d="M254 265 H290"/><path d="M520 265 H556"/><path d="M836 265 H874"/><path d="M1094 265 H1132"/></g>
<path d="M1250 385 C1250 520 701 535 701 394" fill="none" stroke="#168c69" stroke-width="7" stroke-dasharray="14 10" marker-end="url(#arrow)"/><rect x="450" y="473" width="500" height="65" rx="16" fill="#d5f4e8" stroke="#88c7ae" stroke-width="2"/><text x="700" y="514" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#135d47">Gyro + accelerometer feedback</text>
<text x="50" y="630" font-size="23" font-family="Arial,sans-serif" fill="#38536b">The FC keeps comparing measured motion with the requested motion and adjusts each motor repeatedly.</text><text x="50" y="665" font-size="18" font-family="Arial,sans-serif" fill="#607b90">*Protocol names vary by receiver, FC configuration and ESC firmware. This is a conceptual flow, not a wiring diagram.</text>
</g></svg>