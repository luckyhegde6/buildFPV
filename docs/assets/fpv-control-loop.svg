<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">FPV quadcopter control loop</title><desc id="desc">Radio stick input travels to a receiver and flight controller. Gyroscope feedback is compared with the desired response. The controller and mixer command ESCs and motors, whose movement is measured again.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1e40af"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#047857"/></marker></defs>
<rect width="1200" height="390" rx="22" fill="#f8fafc"/>
<text x="34" y="40" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#0f172a">The flight-control loop</text>
<text x="34" y="67" font-family="Arial,sans-serif" font-size="16" fill="#475569">Fast feedback: the FC repeatedly measures motion and adjusts each motor.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="30" y="115" width="190" height="100" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="125" y="151" font-size="20" font-weight="bold" fill="#1e3a8a">1. Radio</text><text x="125" y="179" font-size="15" fill="#1e3a8a">Throttle / Roll</text><text x="125" y="199" font-size="15" fill="#1e3a8a">Pitch / Yaw</text>
<rect x="270" y="115" width="170" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="355" y="151" font-size="20" font-weight="bold" fill="#075985">2. Receiver</text><text x="355" y="180" font-size="15" fill="#075985">Decodes RC link</text><text x="355" y="199" font-size="15" fill="#075985">for the FC</text>
<rect x="490" y="95" width="240" height="140" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="610" y="132" font-size="20" font-weight="bold" fill="#166534">3. Flight controller</text><text x="610" y="163" font-size="15" fill="#166534">Desired response vs.</text><text x="610" y="184" font-size="15" fill="#166534">gyro measurement</text><text x="610" y="207" font-size="15" fill="#166534">controller + mixer</text>
<rect x="780" y="115" width="170" height="100" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="865" y="151" font-size="20" font-weight="bold" fill="#9a3412">4. ESCs</text><text x="865" y="180" font-size="15" fill="#9a3412">Drive motors</text><text x="865" y="199" font-size="15" fill="#9a3412">with controlled power</text>
<rect x="1000" y="115" width="170" height="100" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1085" y="151" font-size="20" font-weight="bold" fill="#9d174d">5. Motors</text><text x="1085" y="180" font-size="15" fill="#9d174d">Change propeller</text><text x="1085" y="199" font-size="15" fill="#9d174d">thrust</text>
<path d="M220 165 H265" stroke="#1e40af" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 165 H485" stroke="#1e40af" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 165 H775" stroke="#1e40af" stroke-width="3" marker-end="url(#arrow)"/><path d="M950 165 H995" stroke="#1e40af" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="350" y="285" width="500" height="60" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="600" y="309" font-size="18" font-weight="bold" fill="#065f46">6. Sensor feedback</text><text x="600" y="330" font-size="15" fill="#065f46">Gyro measures actual rotation; the next loop corrects the error.</text>
<path d="M1085 216 V315 H855" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#green)"/><path d="M350 315 H125 V220" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#green)" stroke-dasharray="7 5"/>
</g></svg>