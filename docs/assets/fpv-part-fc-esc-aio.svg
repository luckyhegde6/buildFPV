<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" fill="#fff" font-weight="700">PART 4 — FC, ESC STACK &amp; AIO</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">FC decides what each motor should do; ESC drives the motor electrically</text><g transform="translate(275 260)"><rect x="-130" y="-100" width="260" height="95" rx="12" fill="#202e3e" stroke="#f0bb50" stroke-width="5"/><rect x="-80" y="-75" width="160" height="45" rx="6" fill="#4e6578" stroke="#b6c9d8" stroke-width="3"/><text x="0" y="-43" fill="#fff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="700">FC</text><path d="M-95 -100 l-20 -20 M95 -100 l20 -20 M-95 -5 l-20 20 M95 -5 l20 20" stroke="#f0bb50" stroke-width="9"/><rect x="-130" y="25" width="260" height="95" rx="12" fill="#203c50" stroke="#51d8eb" stroke-width="5"/><rect x="-80" y="50" width="160" height="45" rx="6" fill="#466176" stroke="#b6c9d8" stroke-width="3"/><text x="0" y="81" fill="#fff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="700">4-in-1 ESC</text><path d="M-95 120 l-20 20 M95 120 l20 20" stroke="#51d8eb" stroke-width="9"/><text x="0" y="178" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Stack: two boards</text></g><g transform="translate(790 260)"><rect x="-130" y="-90" width="260" height="210" rx="18" fill="#1d3347" stroke="#7af2c2" stroke-width="5"/><rect x="-80" y="-40" width="160" height="110" rx="12" fill="#324c60" stroke="#d2e2ec" stroke-width="3"/><text x="0" y="-5" fill="#7af2c2" font-family="Arial" font-size="24" text-anchor="middle" font-weight="700">FC</text><text x="0" y="35" fill="#fff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="700">ESC</text><text x="0" y="165" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">AIO: one board</text></g><path d="M455 260 H630" stroke="#51d8eb" stroke-width="4" stroke-dasharray="8 8"/><rect x="40" y="485" width="1020" height="92" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="62" y="520" font-family="Arial" font-size="21" fill="#ffd278" font-weight="700">Before wiring or firmware</text><text x="62" y="552" font-family="Arial" font-size="19" fill="#fff">Check the exact model/revision, firmware target, battery voltage range, pad labels, receiver input and motor outputs in its manual.</text></svg>