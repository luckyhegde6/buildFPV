<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">FPV drone class selection decision tree</title>
<desc id="desc">A decision tree begins with mission goal and routes indoor practice to tinywhoop, portable outdoor practice to micro, close-proximity filming to cinewhoop, racing and freestyle to purpose-built five-inch options, and long endurance to experienced-pilot long-range aircraft.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#17475c"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9f3ff"/></marker></defs>
<rect width="1400" height="860" rx="28" fill="url(#bg)"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">WHICH FPV DRONE CLASS FITS YOUR GOAL?</text>
<text x="42" y="84" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Start with where you will fly and what you want to do—not the biggest propeller size.</text>
<g font-family="Arial,sans-serif" stroke="#c9f3ff" stroke-width="3" fill="none" marker-end="url(#arr)">
<path d="M700 165 V205"/><path d="M700 283 V320 H180 V365"/><path d="M700 320 H450 V365"/><path d="M700 320 H720 V365"/><path d="M700 320 H1080 V365"/>
<path d="M180 445 V485"/><path d="M450 445 V485"/><path d="M720 445 V485"/><path d="M1080 445 V485"/>
</g>
<g font-family="Arial,sans-serif">
<rect x="430" y="110" width="540" height="55" rx="16" fill="#243f57" stroke="#7dd3fc" stroke-width="3"/><text x="700" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">What matters most for your first goal?</text>
<rect x="485" y="205" width="430" height="78" rx="16" fill="#1b4961" stroke="#7dd3fc" stroke-width="3"/><text x="700" y="238" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Choose a mission</text><text x="700" y="263" text-anchor="middle" font-size="17" fill="#c7f9ff">Space • payload • wind • cost • experience</text>
<rect x="35" y="365" width="290" height="80" rx="16" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="180" y="397" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Indoor / gates</text><text x="180" y="424" text-anchor="middle" font-size="17" fill="#c7f9ff">Tinywhoop / guarded micro</text>
<rect x="305" y="365" width="290" height="80" rx="16" fill="#174b3f" stroke="#86efac" stroke-width="3"/><text x="450" y="397" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Portable outdoors</text><text x="450" y="424" text-anchor="middle" font-size="17" fill="#d1fae5">2–2.5 in open micro / toothpick</text>
<rect x="575" y="365" width="290" height="80" rx="16" fill="#604019" stroke="#fbd38d" stroke-width="3"/><text x="720" y="397" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Close filming</text><text x="720" y="424" text-anchor="middle" font-size="17" fill="#ffedd5">Cinewhoop sized for payload/site</text>
<rect x="935" y="365" width="430" height="80" rx="16" fill="#4c2d68" stroke="#c4b5fd" stroke-width="3"/><text x="1150" y="397" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Fast outdoor / longer missions</text><text x="1150" y="424" text-anchor="middle" font-size="17" fill="#ede9fe">Race • freestyle • experienced long-range</text>
<rect x="35" y="485" width="290" height="155" rx="16" fill="#102e44" stroke="#67e8f9" stroke-width="2"/><text x="180" y="523" text-anchor="middle" font-size="20" font-weight="700" fill="#67e8f9">Tinywhoop</text><text x="58" y="555" font-size="16" fill="#e2f4ff">+ compact and practice-friendly</text><text x="58" y="583" font-size="16" fill="#e2f4ff">− wind / runtime limitations</text><text x="58" y="612" font-size="16" fill="#e2f4ff">Still keep safe distance</text>
<rect x="305" y="485" width="290" height="155" rx="16" fill="#102e44" stroke="#86efac" stroke-width="2"/><text x="450" y="523" text-anchor="middle" font-size="20" font-weight="700" fill="#86efac">2–2.5 in Micro</text><text x="328" y="555" font-size="16" fill="#e2f4ff">+ portable, light outdoor setup</text><text x="328" y="583" font-size="16" fill="#e2f4ff">− exposed props / wind</text><text x="328" y="612" font-size="16" fill="#e2f4ff">Payload is a major factor</text>
<rect x="575" y="485" width="290" height="155" rx="16" fill="#102e44" stroke="#fbd38d" stroke-width="2"/><text x="720" y="523" text-anchor="middle" font-size="20" font-weight="700" fill="#fbd38d">Cinewhoop</text><text x="598" y="555" font-size="16" fill="#e2f4ff">+ camera mount / guard options</text><text x="598" y="583" font-size="16" fill="#e2f4ff">− ducts add mass and drag</text><text x="598" y="612" font-size="16" fill="#e2f4ff">Not collision-proof</text>
<rect x="935" y="485" width="430" height="155" rx="16" fill="#102e44" stroke="#c4b5fd" stroke-width="2"/><text x="1150" y="523" text-anchor="middle" font-size="20" font-weight="700" fill="#c4b5fd">5 in / 7 in</text><text x="960" y="555" font-size="16" fill="#e2f4ff">5 in: racing or freestyle priorities</text><text x="960" y="583" font-size="16" fill="#e2f4ff">7 in: endurance / mission planning</text><text x="960" y="612" font-size="16" fill="#e2f4ff">Higher energy / crash consequences</text>
<rect x="35" y="685" width="1330" height="120" rx="18" fill="#091e31" stroke="#41758b" stroke-width="2"/>
<text x="68" y="725" font-size="22" font-weight="700" fill="#fff">Before buying, also decide</text><text x="68" y="763" font-size="18" fill="#d8ecf6">Control radio • video/goggles ecosystem • battery + charger • tools/spares • local rules • simulator practice</text><text x="68" y="790" font-size="16" fill="#fbd38d">Prop size, wheelbase, frame geometry, mission and BNF/PNP/RTF purchase format are different axes.</text>
</g></svg>