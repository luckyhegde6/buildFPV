<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">FPV drone class overview</title>
<desc id="desc">A schematic comparison from tinywhoop to long-range quadcopter. The silhouettes are illustrative and do not define exact wheelbase or propeller diameter.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#123e56"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/></marker></defs>
<rect width="1400" height="800" rx="28" fill="url(#bg)"/>
<text x="48" y="56" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">FPV DRONE CLASSES — CHOOSE BY PURPOSE</text>
<text x="50" y="88" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Schematic silhouettes only. Propeller diameter and frame wheelbase are different measurements.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(28 120)"><rect width="250" height="300" rx="18" fill="#142f4b" stroke="#4b91a8"/><text x="125" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#67e8f9">TINYWHOOP</text><g transform="translate(125 140)" stroke="#9ec6d9" stroke-width="12" stroke-linecap="round"><path d="M-42 -28 L42 28 M-42 28 L42 -28"/></g><g fill="#122033" stroke="#67e8f9" stroke-width="4"><circle cx="83" cy="232" r="25"/><circle cx="167" cy="232" r="25"/><circle cx="83" cy="168" r="25"/><circle cx="167" cy="168" r="25"/></g><rect x="108" y="183" width="34" height="34" rx="8" fill="#e9b44c"/><text x="125" y="270" text-anchor="middle" font-size="16" fill="#fff">Guarded • indoor</text><text x="125" y="292" text-anchor="middle" font-size="14" fill="#c7f9ff">Small props / ducts</text></g>
<g transform="translate(300 120)"><rect width="250" height="300" rx="18" fill="#142f4b" stroke="#4b91a8"/><text x="125" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#ffdb86">2–2.5 IN MICRO</text><g transform="translate(125 175)" stroke="#9ec6d9" stroke-width="13" stroke-linecap="round"><path d="M-48 -42 L48 42 M-48 42 L48 -42"/></g><g fill="#122033" stroke="#ffdb86" stroke-width="4"><circle cx="77" cy="126" r="21"/><circle cx="173" cy="126" r="21"/><circle cx="77" cy="224" r="21"/><circle cx="173" cy="224" r="21"/></g><rect x="108" y="159" width="34" height="34" rx="6" fill="#e9b44c"/><text x="125" y="270" text-anchor="middle" font-size="16" fill="#fff">Portable • open props</text><text x="125" y="292" text-anchor="middle" font-size="14" fill="#c7f9ff">Outdoor wind matters</text></g>
<g transform="translate(572 120)"><rect width="250" height="300" rx="18" fill="#142f4b" stroke="#4b91a8"/><text x="125" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#7af2c2">3–3.5 CINEWHOOP</text><g transform="translate(125 174)" stroke="#9ec6d9" stroke-width="13" stroke-linecap="round"><path d="M-48 -42 L48 42 M-48 42 L48 -42"/></g><g fill="#122033" stroke="#7af2c2" stroke-width="6"><circle cx="77" cy="126" r="26"/><circle cx="173" cy="126" r="26"/><circle cx="77" cy="224" r="26"/><circle cx="173" cy="224" r="26"/></g><rect x="108" y="158" width="34" height="34" rx="6" fill="#e9b44c"/><rect x="110" y="118" width="30" height="17" rx="3" fill="#eef7ff"/><text x="125" y="270" text-anchor="middle" font-size="16" fill="#fff">Ducts • camera mount</text><text x="125" y="292" text-anchor="middle" font-size="14" fill="#c7f9ff">Payload / drag trade-off</text></g>
<g transform="translate(844 120)"><rect width="250" height="300" rx="18" fill="#142f4b" stroke="#4b91a8"/><text x="125" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#fbad92">5 INCH</text><g transform="translate(125 174)" stroke="#9ec6d9" stroke-width="14" stroke-linecap="round"><path d="M-55 -48 L55 48 M-55 48 L55 -48"/></g><g fill="#122033" stroke="#fbad92" stroke-width="4"><ellipse cx="65" cy="122" rx="32" ry="12"/><ellipse cx="185" cy="122" rx="32" ry="12"/><ellipse cx="65" cy="226" rx="32" ry="12"/><ellipse cx="185" cy="226" rx="32" ry="12"/></g><rect x="107" y="157" width="36" height="36" rx="6" fill="#e9b44c"/><text x="125" y="270" text-anchor="middle" font-size="16" fill="#fff">Race / freestyle</text><text x="125" y="292" text-anchor="middle" font-size="14" fill="#c7f9ff">Power • open props</text></g>
<g transform="translate(1116 120)"><rect width="250" height="300" rx="18" fill="#142f4b" stroke="#4b91a8"/><text x="125" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#c8b5ff">7 INCH</text><g transform="translate(125 174)" stroke="#9ec6d9" stroke-width="15" stroke-linecap="round"><path d="M-62 -52 L62 52 M-62 52 L62 -52"/></g><g fill="#122033" stroke="#c8b5ff" stroke-width="4"><ellipse cx="58" cy="115" rx="34" ry="13"/><ellipse cx="192" cy="115" rx="34" ry="13"/><ellipse cx="58" cy="235" rx="34" ry="13"/><ellipse cx="192" cy="235" rx="34" ry="13"/></g><rect x="105" y="157" width="40" height="40" rx="6" fill="#e9b44c"/><text x="125" y="270" text-anchor="middle" font-size="16" fill="#fff">Long-range / cruise</text><text x="125" y="292" text-anchor="middle" font-size="14" fill="#c7f9ff">Energy • recovery plan</text></g>
</g>
<rect x="48" y="452" width="1304" height="290" rx="20" fill="#0c243a" stroke="#38728c"/>
<text x="78" y="495" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Do not compare using prop size alone</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#e7f5fc">
<text x="80" y="540">• Propeller diameter: nominal propeller class (e.g., 2.5, 3.5, 5 or 7 inches).</text>
<text x="80" y="578">• Wheelbase: distance across the motor layout, usually stated in millimetres.</text>
<text x="80" y="616">• Guarded vs open propellers: frame design and contact/drag trade-offs.</text>
<text x="80" y="654">• Racing, freestyle, cine and long-range: mission priorities, not exact dimensions.</text>
<text x="80" y="692">• BNF / PNP / ARF / RTF: how much equipment is included, not aircraft geometry.</text>
</g>
</svg>