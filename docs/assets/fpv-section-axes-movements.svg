<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">FPV drone axes and stick movements</title><desc id="desc">Four enlarged cards explaining throttle, yaw, pitch and roll using colored arrows.</desc>
<rect width="1400" height="760" rx="28" fill="#f5f9fd"/><rect width="1400" height="100" rx="28" fill="#072a4b"/><rect y="72" width="1400" height="28" fill="#072a4b"/>
<text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">DRONE AXES &amp; STICK MOVEMENTS</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Four commands change thrust, heading or tilt</text>
<g font-family="Arial,sans-serif">
<g><rect x="36" y="130" width="650" height="270" rx="22" fill="#fff" stroke="#c3d4e4" stroke-width="3"/><rect x="36" y="130" width="650" height="58" rx="22" fill="#087d4b"/><rect x="36" y="166" width="650" height="22" fill="#087d4b"/><text x="68" y="169" font-size="31" font-weight="700" fill="#fff">THROTTLE — UP / DOWN</text><text x="72" y="232" font-size="25" fill="#183750">Changes overall thrust request.</text><g stroke="#18a05e" stroke-width="9" stroke-linecap="round"><path d="M130 335 L130 270"/><path d="M205 335 L205 270"/></g><g fill="#18a05e"><path d="M110 276 L130 244 L150 276 Z"/><path d="M185 276 L205 244 L225 276 Z"/></g><g stroke="#e74c3c" stroke-width="8" stroke-linecap="round"><path d="M440 268 L440 333"/><path d="M515 268 L515 333"/></g><g fill="#e74c3c"><path d="M420 324 L440 357 L460 324 Z"/><path d="M495 324 L515 357 L535 324 Z"/></g><text x="570" y="285" font-size="20" fill="#526b80" text-anchor="middle">Climb</text><text x="570" y="322" font-size="20" fill="#526b80" text-anchor="middle">Descend</text></g>
<g><rect x="714" y="130" width="650" height="270" rx="22" fill="#fff" stroke="#c3d4e4" stroke-width="3"/><rect x="714" y="130" width="650" height="58" rx="22" fill="#b51e32"/><rect x="714" y="166" width="650" height="22" fill="#b51e32"/><text x="746" y="169" font-size="31" font-weight="700" fill="#fff">YAW — ROTATE LEFT / RIGHT</text><text x="750" y="232" font-size="25" fill="#183750">Changes nose heading around the vertical axis.</text><g transform="translate(1038 306)"><rect x="-50" y="-35" width="100" height="70" rx="16" fill="#243f5a"/><path d="M-50 -18 L-118 -65 M50 -18 L118 -65 M-50 18 L-118 65 M50 18 L118 65" stroke="#3b627f" stroke-width="13" stroke-linecap="round"/><circle cx="-118" cy="-65" r="18" fill="#cc3949"/><circle cx="118" cy="65" r="18" fill="#cc3949"/><path d="M-155 -45 A170 120 0 0 1 140 -70" fill="none" stroke="#d92b42" stroke-width="7"/><path d="M128 -86 L153 -66 L123 -58" fill="#d92b42"/><path d="M155 45 A170 120 0 0 1 -140 70" fill="none" stroke="#1174cf" stroke-width="7"/><path d="M-128 86 L-153 66 L-123 58" fill="#1174cf"/></g></g>
<g><rect x="36" y="430" width="650" height="270" rx="22" fill="#fff" stroke="#c3d4e4" stroke-width="3"/><rect x="36" y="430" width="650" height="58" rx="22" fill="#1674db"/><rect x="36" y="466" width="650" height="22" fill="#1674db"/><text x="68" y="469" font-size="31" font-weight="700" fill="#fff">PITCH — FORWARD / BACK</text><text x="72" y="532" font-size="25" fill="#183750">Tilts the nose forward or backward.</text><g transform="translate(280 622)"><path d="M-95 40 L0 -15 L95 40" fill="none" stroke="#355b7a" stroke-width="18" stroke-linecap="round"/><rect x="-38" y="-15" width="76" height="58" rx="12" fill="#243f5a"/><circle cx="-95" cy="40" r="17" fill="#111f2e"/><circle cx="95" cy="40" r="17" fill="#111f2e"/><path d="M110 0 L185 0" stroke="#1476df" stroke-width="9" stroke-linecap="round"/><path d="M174 -19 L207 0 L174 19" fill="#1476df"/><path d="M-110 80 L-185 80" stroke="#1476df" stroke-width="9" stroke-linecap="round"/><path d="M-174 61 L-207 80 L-174 99" fill="#1476df"/></g><text x="510" y="614" font-size="22" fill="#526b80">Forward</text><text x="510" y="652" font-size="22" fill="#526b80">Backward</text></g>
<g><rect x="714" y="430" width="650" height="270" rx="22" fill="#fff" stroke="#c3d4e4" stroke-width="3"/><rect x="714" y="430" width="650" height="58" rx="22" fill="#7438bf"/><rect x="714" y="466" width="650" height="22" fill="#7438bf"/><text x="746" y="469" font-size="31" font-weight="700" fill="#fff">ROLL — LEFT / RIGHT</text><text x="750" y="532" font-size="25" fill="#183750">Tilts the quad sideways to translate laterally.</text><g transform="translate(1040 625)"><path d="M-88 0 L0 -32 L88 0 L0 32 Z" fill="#243f5a" stroke="#355b7a" stroke-width="8"/><circle cx="-88" cy="0" r="16" fill="#111f2e"/><circle cx="88" cy="0" r="16" fill="#111f2e"/><path d="M-145 -53 C-185 -20 -185 20 -145 53" fill="none" stroke="#8a46d4" stroke-width="8"/><path d="M-164 40 L-140 60 L-140 28" fill="#8a46d4"/><path d="M145 53 C185 20 185 -20 145 -53" fill="none" stroke="#18a05e" stroke-width="8"/><path d="M164 -40 L140 -60 L140 -28" fill="#18a05e"/></g><text x="1260" y="604" font-size="21" fill="#526b80" text-anchor="middle">Left</text><text x="1260" y="644" font-size="21" fill="#526b80" text-anchor="middle">Right</text></g>
</g></svg>