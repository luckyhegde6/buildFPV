<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — ELECTRONIC SPEED CONTROLLER (ESC)</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Transforms the FC's motor commands into switched power for brushless motors</text><g transform="translate(430 310)"><rect x="-170" y="-140" width="340" height="280" rx="24" fill="#1a354a" stroke="#67bcd1" stroke-width="5"/><rect x="-100" y="-72" width="200" height="145" rx="16" fill="#0a1e30" stroke="#9fb6c8" stroke-width="4"/><rect x="-75" y="-47" width="150" height="95" rx="8" fill="#314a5e"/><text x="0" y="-8" fill="#fff" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700">4-in-1</text><text x="0" y="27" fill="#6ee7ff" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">ESC</text><g fill="#e0b34e"><circle cx="-142" cy="-112" r="12"/><circle cx="142" cy="-112" r="12"/><circle cx="-142" cy="112" r="12"/><circle cx="142" cy="112" r="12"/></g><g stroke="#f4bd50" stroke-width="8"><path d="M-110 -140 v-32 M-40 -140 v-32 M30 -140 v-32 M100 -140 v-32"/><path d="M-110 140 v32 M-40 140 v32 M30 140 v32 M100 140 v32"/></g><text x="-200" y="-205" fill="#ffd278" font-family="Arial" font-size="19">Motor outputs</text><text x="-180" y="210" fill="#ffd278" font-family="Arial" font-size="19">Battery pads / power</text></g><g font-family="Arial"><path d="M610 195 H700" stroke="#6ee7ff" stroke-width="3"/><text x="715" y="201" font-size="20" fill="#6ee7ff">FC connection</text><path d="M610 310 H700" stroke="#6ee7ff" stroke-width="3"/><text x="715" y="316" font-size="20" fill="#6ee7ff">4 motor channels</text><path d="M610 424 H700" stroke="#6ee7ff" stroke-width="3"/><te