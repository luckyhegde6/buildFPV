<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Propeller diameter comparison for 2.5, 3.5, 5 and 7 inch FPV classes</title>
<desc id="desc">Four circles drawn to the same scale represent 2.5-inch, 3.5-inch, 5-inch and 7-inch nominal propeller diameters. This compares prop diameter only, not wheelbase or frame clearance.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#16465c"/></linearGradient><marker id="dim" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse"><path d="M0,0 L9,3 L0,6 z" fill="#fbd38d"/></marker></defs><rect width="1400" height="760" rx="26" fill="url(#bg)"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">PROP DIAMETER — SHOWN TO A COMMON SCALE</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Only nominal propeller diameter is scaled here. Wheelbase and physical frame dimensions are separate values.</text>
<g fill="#17364f" stroke-width="5">
<circle cx="175" cy="365" r="60" stroke="#67e8f9"/><circle cx="450" cy="365" r="84" stroke="#86efac"/><circle cx="785" cy="365" r="120" stroke="#fbd38d"/><circle cx="1190" cy="365" r="168" stroke="#c4b5fd"/>
</g>
<g stroke="#fbd38d" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"><path d="M115 365 H235"/><path d="M366 365 H534"/><path d="M665 365 H905"/><path d="M1022 365 H1358"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="175" y="474" font-size="24" font-weight="700" fill="#67e8f9">2.5 inch</text><text x="175" y="504" font-size="20" fill="#fff">63.5 mm</text>
<text x="450" y="490" font-size="24" font-weight="700" fill="#86efac">3.5 inch</text><text x="450" y="520" font-size="20" fill="#fff">88.9 mm</text>
<text x="785" y="526" font-size="24" font-weight="700" fill="#fbd38d">5 inch</text><text x="785" y="556" font-size="20" fill="#fff">127.0 mm</text>
<text x="1190" y="574" font-size="24" font-weight="700" fill="#c4b5fd">7 inch</text><text x="1190" y="604" font-size="20" fill="#fff">177.8 mm</text>
</g>
<rect x="42" y="650" width="1316" height="70" rx="15" fill="#0a2033" stroke="#426d83" stroke-width="2"/>
<text x="70" y="680" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fbd38d">Diameter math:</text><text x="228" y="680" font-family="Arial,sans-serif" font-size="18" fill="#e5f3fb">1 inch = 25.4 mm. Circles are proportionally scaled, but real prop outlines/blade shape differ.</text><text x="70" y="705" font-family="Arial,sans-serif" font-size="16" fill="#c7f9ff">This is not a wheelbase diagram, motor map or clearance template. Check exact prop and frame drawings.</text>
</svg>