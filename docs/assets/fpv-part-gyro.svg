<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — GYROSCOPE &amp; ACCELEROMETER</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Sensors report movement so the flight controller can stabilize the quad</text><g transform="translate(280 265)"><rect x="-130" y="-110" width="260" height="220" rx="18" fill="#1a354a" stroke="#67bcd1" stroke-width="5"/><rect x="-68" y="-62" width="136" height="124" rx="14" fill="#c99d43" stroke="#f9d986" stroke-width="4"/><path d="M0 -42 V42 M-42 0 H42" stroke="#172d41" stroke-width="8"/><path d="M0 -100 V-76 M0 76 V100 M-120 0 h28 M92 0 h28" stroke="#f3bd55" stroke-width="7"/><text x="0" y="150" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">IMU sensor</text></g><g transform="translate(720 250)" font-family="Arial"><rect x="-145" y="-95" width="290" height="190" rx="16" fill="#0a2137" stroke="#337ea0" stroke-width="2"/><text x="0" y="-53" text-anchor="middle" font-size="25" fill="#6ee7ff" font-weight="700">Gyroscope</text><text x="0" y="-17" text-anchor="middle" font-size="19" fill="#fff">Measures rotation rate</text><text x="0" y="20" text-anchor="middle" font-size="25" fill="#7af2c2" font-weight="700">Accelerometer</text><text x="0" y="56" text-anchor="middle" font-size="19" fill="#fff">Helps estimate tilt</text></g><path d="M420 265 H550" stroke="#6ee7ff" stroke-width="5"/><path d="M535 252 L550 265 L535 278" fill="none" stroke="#6ee7ff" stroke-width="5"/><rect x="45" y="480" width="1010" height="94" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="68" y="516" font-family="Arial" font-size="21" fill="#ffd278" font-weight="700">Keep readings clean</text><text x="68" y="546" font-family="Arial" font-size="19" fill="#fff">Correct board orientation and good mechanical condition matter. GPS is slower navigation data and does not replace gyro feedback.</text></svg>