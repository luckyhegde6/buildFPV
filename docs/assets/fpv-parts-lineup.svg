<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">FPV Drone Parts Lineup</title><desc id="desc">A visual guide to the main components and signal/power flows in a beginner FPV quadcopter.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06182c"/><stop offset="1" stop-color="#123d62"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#173d5d"/><stop offset="1" stop-color="#0d2942"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6Z" fill="#51d8eb"/></marker></defs>
<rect width="1500" height="940" rx="28" fill="url(#bg)"/><text x="48" y="66" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">FPV DRONE PARTS — FOLLOW THE LINEUP</text><text x="50" y="102" fill="#aeeefa" font-family="Arial,sans-serif" font-size="22">Structure → Power → Flight control → Propulsion → Radio &amp; video → Optional modules</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(35 140)"><rect width="345" height="270" rx="18" fill="url(#card)" stroke="#2e7899"/><text x="172" y="35" fill="#6ee7ff" font-size="25" font-weight="700">1. STRUCTURE</text><path d="M90 135 L250 135 M170 70 L170 208 M105 92 L235 178 M105 178 L235 92" stroke="#8ea5bb" stroke-width="24" stroke-linecap="round"/><circle cx="92" cy="92" r="28" fill="#1b3246" stroke="#45d9ef" stroke-width="5"/><circle cx="248" cy="92" r="28" fill="#1b3246" stroke="#45d9ef" stroke-width="5"/><circle cx="92" cy="178" r="28" fill="#1b3246" stroke="#45d9ef" stroke-width="5"/><circle cx="248" cy="178" r="28" fill="#1b3246" stroke="#45d9ef" stroke-width="5"/><rect x="142" y="102" width="56" height="68" rx="8" fill="#e2a83b" stroke="#fff" stroke-width="2"/><text x="172" y="242" fill="#fff" font-size="19">Frame • arms • mounts</text></g>
<g transform="translate(400 140)"><rect width="345" height="270" rx="18" fill="url(#card)" stroke="#2e7899"/><text x="172" y="35" fill="#ffd278" font-size="25" font-weight="700">2. POWER</text><rect x="82" y="81" width="180" height="92" rx="10" fill="#242b35" stroke="#f8b84e" stroke-width="4"/><rect x="103" y="98" width="137" height="56" rx="6" fill="#111b27" stroke="#768da1"/><text x="171" y="133" fill="#ffd278" font-size="26" font-weight="700">LiPo</text><path d="M263 110 h42 v28 h-42" fill="none" stroke="#f8b84e" stroke-width="5"/><path d="M92 172 v22 h162 v-22" fill="none" stroke="#51d8eb" stroke-width="4" marker-end="url(#arr)"/><text x="172" y="226" fill="#fff" font-size="19">Battery • wires • regulators</text><text x="172" y="249" fill="#aeeefa" font-size="15">Voltage must match each part</text></g>
<g transform="translate(765 140)"><rect width="345" height="270" rx="18" fill="url(#card)" stroke="#2e7899"/><text x="172" y="35" fill="#7af2c2" font-size="25" font-weight="700">3. FLIGHT CONTROL</text><rect x="89" y="80" width="166" height="105" rx="12" fill="#111d2a" stroke="#7af2c2" stroke-width="4"/><rect x="125" y="108" width="94" height="48" rx="5" fill="#e0a937"/><rect x="100" y="92" width="18" height="18" fill="#f1c96e"/><rect x="225" y="92" width="18" height="18" fill="#f1c96e"/><rect x="100" y="155" width="18" height="18" fill="#f1c96e"/><rect x="225" y="155" width="18" height="18" fill="#f1c96e"/><path d="M172 188 v18" stroke="#7af2c2" stroke-width="4" marker-end="url(#arr)"/><text x="172" y="231" fill="#fff" font-size="19">FC + gyro + ESC</text><text x="172" y="253" fill="#aeeefa" font-size="15">Computes motor corrections</text></g>
<g transform="translate(1130 140)"><rect width="335" height="270" rx="18" fill="url(#card)" stroke="#2e7899"/><text x="167" y="35" fill="#ff9d79" font-size="25" font-weight="700">4. THRUST</text><g transform="translate(82 90)"><ellipse cx="0" cy="25" rx="54" ry="14" fill="#ef765b" opacity=".8"/><ellipse cx="0" cy="-1" rx="11" ry="49" fill="#ef765b"/><circle cx="0" cy="0" r="18" fill="#e6b34a" stroke="#fff" stroke-width="2"/><path d="M0 23 v40" stroke="#b6c7d6" stroke-width="8"/></g><g transform="translate(252 90)"><ellipse cx="0" cy="25" rx="54" ry="14" fill="#51d8eb" opacity=".8"/><ellipse cx="0" cy="-1" rx="11" ry="49" fill="#51d8eb"/><circle cx="0" cy="0" r="18" fill="#e6b34a" stroke="#fff" stroke-width="2"/><path d="M0 23 v40" stroke="#b6c7d6" stroke-width="8"/></g><text x="167" y="190" fill="#fff" font-size="19">4 brushless motors + props</text><text x="167" y="221" fill="#aeeefa" font-size="16">ESC changes their speed</text><text x="167" y="244" fill="#aeeefa" font-size="16">Propellers accelerate air</text></g>
<g transform="translate(35 440)"><rect width="465" height="265" rx="18" fill="url(#card)" stroke="#2e7899"/><text x="232" y="38" fill="#6ee7ff" font-size="25" font-weight="700">5. CONTROL RADIO</text><rect x="48" y="76" width="115" height="100" rx="16" fill="#222b38" stroke="#aabed1" stroke-width="3"/><rect x="78" y="89" width="55" height="22" rx="4" fill="#74ddeb"/><circle cx="78" cy="135" r="17" fill="#0a1622" stroke="#aabed1" stroke-width="3"/><circle cx="132" cy="135" r="17" fill="#0a1622" stroke="#aabed1" stroke-width="3"/><path d="M177 125 q24 -28 48 0 q-24 28 -48 0 M201 125 q30 -45 60 0 q-30 45 -60 0" fill="none" stroke="#51d8eb" stroke-width="5"/><rect x="280" y="87" width="112" height="74" rx="10" fill="#111d2a" stroke="#e5ae45" stroke-width="4"/><path d="M302 87 l-11 -26 M371 87 l12 -26" stroke="#aabed1" stroke-width="5"/><text x="232" y="208" fill="#fff" font-size="19">Radio → ELRS receiver → FC</text><text x="232" y="237" fill="#aeeefa" font-size="16">Carries stick commands, not video</text></g>
<g transform="translate(520 440)"><rect width="465" height="265" rx="18" fill="url(#card)" stroke="#2e7899"/><text x="232" y="38" fill="#6ee7ff" font-size="25" font-weight="700">6. FPV VIDEO</text><rect x="45" y="88" width="88" height="65" rx="10" fill="#111d2a" stroke="#aabed1" stroke-width="4"/><circle cx="89" cy="120" r="22" fill="#172f47" stroke="#51d8eb" stroke-width="5"/><path d="M139 121 h46" stroke="#51d8eb" stroke-width="4" marker-end="url(#arr)"/><rect x="192" y="89" width="105" height="63" rx="10" fill="#e0a937" stroke="#fff" stroke-width="2"/><path d="M296 121 h47" stroke="#51d8eb" stroke-width="4" marker-end="url(#arr)"/><path d="M358 107 q30 14 0 28 M372 96 q50 25 0 50" fill="none" stroke="#51d8eb" stroke-width="5"/><rect x="392" y="96" width="34" height="54" rx="8" fill="#192938" stroke="#aabed1" stroke-width="4"/><text x="232" y="203" fill="#fff" font-size="19">Camera → VTX/air unit → goggles</text><text x="232" y="232" fill="#aeeefa" font-size="16">Must match video ecosystem</text></g>
<g transform="translate(1005 440)"><rect width="460" height="265" rx="18" fill="url(#card)" stroke="#2e7899"/><text x="230" y="38" fill="#7af2c2" font-size="25" font-weight="700">7. OPTIONAL MODULES</text><g transform="translate(78 104)"><rect x="-40" y="-22" width="80" height="52" rx="7" fill="#d7bd70" stroke="#fff" stroke-width="2"/><rect x="-24" y="-12" width="48" height="30" fill="#1c513f"/><path d="M0 -24 v-26" stroke="#51d8eb" stroke-width="5"/><circle cx="0" cy="-55" r="15" fill="#51d8eb"/></g><g transform="translate(230 100)"><circle cx="0" cy="0" r="39" fill="#182938" stroke="#7af2c2" stroke-width="4"/><circle cx="0" cy="0" r="23" fill="#6b7d8b"/><path d="M0 -17 v34 M-17 0 h34" stroke="#e9f4ff" stroke-width="5"/></g><g transform="translate(365 100)"><path d="M-30 22 L-14 -25 L14 -25 L30 22 Z" fill="#253e55" stroke="#ffb76c" stroke-width="4"/><path d="M0 -25 v-38" stroke="#ffb76c" stroke-width="5"/><path d="M0 -58 q20 12 0 24 q-20 12 0 24" fill="none" stroke="#ffb76c" stroke-width="4"/></g><text x="230" y="183" fill="#fff" font-size="19">GPS/GNSS • buzzer • logging</text><text x="230" y="211" fill="#aeeefa" font-size="16">Position, recovery and diagnostics</text><text x="230" y="237" fill="#aeeefa" font-size="16">Not required on every build</text></g>
<rect x="35" y="750" width="1430" height="145" rx="18" fill="#091c2f" stroke="#2e7899"/><text x="63" y="790" fill="#fff" font-size="26" font-family="Arial,sans-serif" font-weight="700">Three paths to keep separate</text>
<g font-family="Arial,sans-serif" font-size="21"><text x="65" y="834" fill="#6ee7ff">CONTROL</text><text x="240" y="834" fill="#fff">Radio → Receiver → FC</text><text x="570" y="834" fill="#ffd278">POWER</text><text x="690" y="834" fill="#fff">LiPo → Power/ESC → Motors + regulated electronics</text><text x="65" y="872" fill="#7af2c2">VIDEO</text><text x="240" y="872" fill="#fff">Camera → VTX/Air Unit → VRX/Goggles</text><text x="790" y="872" fill="#ffbd9d">Safety: remove propellers for all bench configuration and motor tests.</text></g>
</g></svg>