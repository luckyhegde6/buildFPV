<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Analog versus digital FPV video system paths</title>
<desc id="desc">Parallel video chains compare analog camera to analog VTX and analog goggles/VRX with digital camera module to matching digital air unit and ecosystem-specific goggles. A separate control chain is shown below.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#174259"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e2f5ff"/></marker></defs>
<rect width="1400" height="760" rx="26" fill="url(#bg)"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#fff">ANALOG VS DIGITAL FPV VIDEO</text>
<text x="42" y="83" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Every link must match; “HD” does not imply cross-brand compatibility.</text>
<!-- analog row -->
<rect x="35" y="116" width="1330" height="226" rx="20" fill="#17344c" stroke="#f2bd61" stroke-width="2"/>
<text x="65" y="153" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffd78b">ANALOG VIDEO PATH</text>
<g font-family="Arial,sans-serif">
<rect x="65" y="180" width="220" height="98" rx="14" fill="#263f52" stroke="#ffd78b" stroke-width="2"/><text x="175" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Analog FPV</text><text x="175" y="247" text-anchor="middle" font-size="19" fill="#ffe6b5">camera</text>
<path d="M285 230 H375" stroke="#e2f5ff" stroke-width="4" marker-end="url(#arr)"/>
<rect x="390" y="180" width="220" height="98" rx="14" fill="#263f52" stroke="#ffd78b" stroke-width="2"/><text x="500" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Analog VTX</text><text x="500" y="247" text-anchor="middle" font-size="19" fill="#ffe6b5">video transmitter</text>
<path d="M610 230 H700" stroke="#e2f5ff" stroke-width="4" marker-end="url(#arr)"/>
<rect x="715" y="180" width="220" height="98" rx="14" fill="#263f52" stroke="#ffd78b" stroke-width="2"/><text x="825" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Antenna / RF</text><text x="825" y="247" text-anchor="middle" font-size="19" fill="#ffe6b5">matched band/polarity</text>
<path d="M935 230 H1025" stroke="#e2f5ff" stroke-width="4" marker-end="url(#arr)"/>
<rect x="1040" y="180" width="285" height="98" rx="14" fill="#263f52" stroke="#ffd78b" stroke-width="2"/><text x="1182" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Analog VRX / goggles</text><text x="1182" y="247" text-anchor="middle" font-size="19" fill="#ffe6b5">compatible receiver</text>
<text x="65" y="319" font-size="16" fill="#ffe6b5">Often lightweight and modular; image detail is lower and may degrade progressively with noise/interference.</text>
</g>
<!-- digital row -->
<rect x="35" y="365" width="1330" height="226" rx="20" fill="#17344c" stroke="#7dd3fc" stroke-width="2"/>
<text x="65" y="402" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7dd3fc">DIGITAL VIDEO PATH</text>
<g font-family="Arial,sans-serif">
<rect x="65" y="430" width="220" height="98" rx="14" fill="#263f52" stroke="#7dd3fc" stroke-width="2"/><text x="175" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Matched camera</text><text x="175" y="497" text-anchor="middle" font-size="19" fill="#bcecff">module / sensor</text>
<path d="M285 480 H375" stroke="#e2f5ff" stroke-width="4" marker-end="url(#arr)"/>
<rect x="390" y="430" width="220" height="98" rx="14" fill="#263f52" stroke="#7dd3fc" stroke-width="2"/><text x="500" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Digital air unit</text><text x="500" y="497" text-anchor="middle" font-size="19" fill="#bcecff">VTX / encoder</text>
<path d="M610 480 H700" stroke="#e2f5ff" stroke-width="4" marker-end="url(#arr)"/>
<rect x="715" y="430" width="220" height="98" rx="14" fill="#263f52" stroke="#7dd3fc" stroke-width="2"/><text x="825" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">RF / antenna</text><text x="825" y="497" text-anchor="middle" font-size="19" fill="#bcecff">band / power / region</text>
<path d="M935 480 H1025" stroke="#e2f5ff" stroke-width="4" marker-end="url(#arr)"/>
<rect x="1040" y="430" width="285" height="98" rx="14" fill="#263f52" stroke="#7dd3fc" stroke-width="2"/><text x="1182" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Matching ecosystem</text><text x="1182" y="497" text-anchor="middle" font-size="19" fill="#bcecff">goggles / VRX generation</text>
<text x="65" y="568" font-size="16" fill="#bcecff">Higher-detail options and onboard recording exist; weight, heat, price, latency and ecosystem differ by model.</text>
</g>
<!-- separate control path -->
<rect x="35" y="615" width="1330" height="105" rx="20" fill="#0a2033" stroke="#86efac" stroke-width="2"/>
<text x="65" y="651" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#86efac">SEPARATE CONTROL LINK</text>
<text x="65" y="687" font-family="Arial,sans-serif" font-size="19" fill="#e4f8ec">Radio transmitter → aircraft control receiver (e.g. ELRS) → flight controller</text>
<text x="790" y="687" font-family="Arial,sans-serif" font-size="16" fill="#fbd38d">Do not confuse RX with goggles' video receiver (VRX).</text>
</svg>