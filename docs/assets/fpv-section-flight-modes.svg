<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">FPV flight modes compared</title><desc id="desc">Comparison cards for Angle, Horizon, Acro/Rate and GPS rescue with clear behavior notes.</desc>
<rect width="1400" height="660" rx="28" fill="#f5f9fd"/><rect width="1400" height="100" rx="28" fill="#092b4c"/><rect y="72" width="1400" height="28" fill="#092b4c"/><text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">FLIGHT MODES — WHAT CHANGES?</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">The mode changes how the flight controller interprets stick commands</text>
<g font-family="Arial,sans-serif">
<g><rect x="36" y="135" width="320" height="420" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="36" y="135" width="320" height="70" rx="22" fill="#11804f"/><rect x="36" y="180" width="320" height="25" fill="#11804f"/><text x="196" y="180" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">ANGLE</text><circle cx="196" cy="285" r="54" fill="#d7f3e5" stroke="#61ad89" stroke-width="4"/><path d="M166 285 L196 255 L226 285 L196 315 Z" fill="#17754c"/><text x="62" y="382" font-size="22" font-weight="700" fill="#123b5b">Self-leveling</text><text x="62" y="420" font-size="21" fill="#315874">Returns toward level when</text><text x="62" y="450" font-size="21" fill="#315874">sticks are centered. Often</text><text x="62" y="480" font-size="21" fill="#315874">a beginner practice mode.</text></g>
<g><rect x="376" y="135" width="320" height="420" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="376" y="135" width="320" height="70" rx="22" fill="#1c73bd"/><rect x="376" y="180" width="320" height="25" fill="#1c73bd"/><text x="536" y="180" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">HORIZON</text><circle cx="536" cy="285" r="54" fill="#dceefe" stroke="#7db4df" stroke-width="4"/><path d="M506 285 L536 255 L566 285 L536 315 Z" fill="#1c73bd"/><text x="402" y="382" font-size="22" font-weight="700" fill="#123b5b">Hybrid feel</text><text x="402" y="420" font-size="21" fill="#315874">Self-levels with smaller</text><text x="402" y="450" font-size="21" fill="#315874">stick inputs; may permit</text><text x="402" y="480" font-size="21" fill="#315874">acro-style flips at extremes.</text></g>
<g><rect x="716" y="135" width="320" height="420" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="716" y="135" width="320" height="70" rx="22" fill="#8338bf"/><rect x="716" y="180" width="320" height="25" fill="#8338bf"/><text x="876" y="180" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">ACRO / RATE</text><circle cx="876" cy="285" r="54" fill="#eee1fb" stroke="#c2a1e7" stroke-width="4"/><path d="M846 285 L876 255 L906 285 L876 315 Z" fill="#8338bf"/><text x="742" y="382" font-size="22" font-weight="700" fill="#123b5b">Rate control</text><text x="742" y="420" font-size="21" fill="#315874">Stick position requests</text><text x="742" y="450" font-size="21" fill="#315874">rotation rate; no automatic</text><text x="742" y="480" font-size="21" fill="#315874">self-leveling in the usual setup.</text></g>
<g><rect x="1056" y="135" width="308" height="420" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="1056" y="135" width="308" height="70" rx="22" fill="#c45b1d"/><rect x="1056" y="180" width="308" height="25" fill="#c45b1d"/><text x="1210" y="180" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">GPS RESCUE</text><circle cx="1210" cy="285" r="54" fill="#ffeadc" stroke="#e5b18f" stroke-width="4"/><path d="M1180 285 L1210 255 L1240 285 L1210 315 Z" fill="#c45b1d"/><text x="1082" y="382" font-size="22" font-weight="700" fill="#123b5b">Firmware-dependent</text><text x="1082" y="420" font-size="21" fill="#315874">May attempt recovery using</text><text x="1082" y="450" font-size="21" fill="#315874">GPS and configured sensors.</text><text x="1082" y="480" font-size="21" fill="#315874">Never assume it will save a lost link.</text></g>
<text x="50" y="602" font-size="21" fill="#315874">Mode names and behavior depend on firmware and configuration. Practise in a simulator and verify the exact setup before flight.</text>
</g></svg>