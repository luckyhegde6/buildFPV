<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" fill="#fff" font-weight="700">PART 8 — ANTENNAS</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Choose the antenna for the actual link, band, connector and polarization</text><g transform="translate(190 250)"><rect x="-8" y="-15" width="16" height="135" rx="7" fill="#e9bd59"/><rect x="-16" y="105" width="32" height="35" rx="5" fill="#bbc9d6"/><text x="0" y="183" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Linear / dipole</text><text x="0" y="212" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">Lightweight • simple</text><path d="M-35 -15 Q-90 50 -35 100 M35 -15 Q90 50 35 100" fill="none" stroke="#51d8eb" stroke-width="4"/></g><g transform="translate(450 250)"><path d="M0 88 C-65 60 -60 -10 0 -35 C60 -10 65 60 0 88 M0 88 C-30 15 30 15 0 -35" fill="none" stroke="#ff9a62" stroke-width="7"/><rect x="-13" y="82" width="26" height="50" rx="5" fill="#c7d0da"/><text x="0" y="183" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Circular</text><text x="0" y="212" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">RHCP or LHCP</text></g><g transform="translate(710 250)"><rect x="-73" y="-45" width="146" height="115" rx="13" fill="#253f56" stroke="#dce8f0" stroke-width="4"/><rect x="-53" y="-25" width="106" height="75" rx="5" fill="#111e2c" stroke="#51d8eb" stroke-width="3"/><path d="M0 70 v62" stroke="#d0d9e1" stroke-width="12"/><text x="0" y="183" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Patch / directional</text><text x="0" y="212" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">Higher gain • aim it</text><path d="M90 0 q50 60 0 120 M110 -15 q80 75 0 150" fill="none" stroke="#7af2c2" stroke-width="4"/></g><g transform="translate(945 250)"><rect x="-42" y="-50" width="84" height="120" rx="18" fill="#c6d2dc" stroke="#fff" stroke-width="3"/><rect x="-28" y="-34" width="56" height="86" rx="12" fill="#1b344b"/><path d="M0 -50 v-45" stroke="#51d8eb" stroke-width="5"/><text x="0" y="183" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Omni / stubby</text><text x="0" y="212" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">Broad coverage</text></g><rect x="40" y="500" width="1020" height="68" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="62" y="542" font-family="Arial" font-size="19" fill="#fff">Important: control-link and video antennas may use different bands. Keep polarization consistent at both ends where required.</text></svg>