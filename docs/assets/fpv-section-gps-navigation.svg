<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
<title id="title">GPS and navigation in an FPV quadcopter</title><desc id="desc">GPS satellites send data to a GNSS module that feeds the flight controller, enabling supported position and telemetry features.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1684d8"/></marker></defs><rect width="1400" height="590" rx="28" fill="#f5f9fd"/><rect width="1400" height="100" rx="28" fill="#092b4c"/><rect y="72" width="1400" height="28" fill="#092b4c"/><text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">GPS / GNSS AND NAVIGATION</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Position data can support telemetry and selected navigation features</text>
<g font-family="Arial,sans-serif">
<rect x="48" y="170" width="300" height="220" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><g transform="translate(198 248)" stroke="#367cb0" stroke-width="5" fill="#8fc3e6"><rect x="-29" y="-18" width="58" height="36" rx="7" fill="#d6ebf8"/><path d="M-29 -40 L-58 -55 L-58 -24 L-29 -12 M29 -40 L58 -55 L58 -24 L29 -12 M-29 40 L-58 55 L-58 24 L-29 12 M29 40 L58 55 L58 24 L29 12"/></g><text x="198" y="330" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">Satellites</text><text x="198" y="365" text-anchor="middle" font-size="21" fill="#405f78">Provide navigation signals</text>
<rect x="442" y="170" width="300" height="220" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="522" y="222" width="140" height="78" rx="16" fill="#d5e8f5" stroke="#72a0be" stroke-width="4"/><rect x="555" y="241" width="74" height="40" rx="8" fill="#d5b15b"/><circle cx="542" cy="237" r="4" fill="#315874"/><circle cx="643" cy="287" r="4" fill="#315874"/><text x="592" y="330" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">GNSS module</text><text x="592" y="365" text-anchor="middle" font-size="21" fill="#405f78">Calculates position / speed</text>
<rect x="836" y="170" width="300" height="220" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><rect x="916" y="218" width="140" height="91" rx="14" fill="#1d684b" stroke="#0d4932" stroke-width="4"/><rect x="949" y="239" width="74" height="47" rx="8" fill="#d8ac47"/><text x="986" y="330" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">Flight controller</text><text x="986" y="365" text-anchor="middle" font-size="21" fill="#405f78">Uses data if configured</text>
<g stroke="#1684d8" stroke-width="7" marker-end="url(#a)"><path d="M348 280 H432"/><path d="M742 280 H826"/></g>
<rect x="48" y="435" width="1300" height="102" rx="20" fill="#e5f5ec" stroke="#a7d5bb" stroke-width="2"/><g fill="#12573e" font-size="22"><text x="78" y="473" font-weight="700">Potential uses (firmware / setup dependent)</text><text x="78" y="509">• GPS rescue / return-to-home  • Position and speed telemetry  • Navigation logs  • Waypoints on supported firmware</text></g>
<text x="48" y="568" font-size="18" fill="#607b90">GPS does not guarantee a safe return. Antenna view, satellite fix, configuration, failsafe settings and the flying environment all matter.</text>
</g></svg>