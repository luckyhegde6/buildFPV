<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" fill="#fff" font-weight="700">PART 9 — GPS, BUZZER &amp; LOGGING</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Optional modules support navigation data, recovery and diagnosis</text><g transform="translate(205 250)"><rect x="-68" y="-52" width="136" height="104" rx="10" fill="#c7ad66" stroke="#fff" stroke-width="4"/><rect x="-43" y="-30" width="86" height="60" rx="6" fill="#1b5447" stroke="#51d8eb" stroke-width="3"/><circle cx="0" cy="0" r="17" fill="#e9c06a"/><path d="M-50 -55 l-24 -22 M50 -55 l24 -22" stroke="#9caebe" stroke-width="6"/><text x="0" y="112" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">GPS / GNSS</text><text x="0" y="141" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">Position and speed</text></g><g transform="translate(550 250)"><circle r="72" fill="#172d41" stroke="#7af2c2" stroke-width="5"/><circle r="42" fill="#708597" stroke="#cbd9e5" stroke-width="3"/><circle r="15" fill="#192938"/><path d="M0 -42 v84 M-42 0 h84" stroke="#d7e2ea" stroke-width="5"/><text x="0" y="112" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Buzzer</text><text x="0" y="141" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">Helps locate the quad</text></g><g transform="translate(875 250)"><rect x="-80" y="-55" width="160" height="110" rx="12" fill="#20374a" stroke="#f4bc54" stroke-width="4"/><rect x="-53" y="-31" width="106" height="61" rx="7" fill="#0f2030" stroke="#6ee7ff" stroke-width="3"/><g stroke="#f4bc54" stroke-width="4"><path d="M-65 -44 h-17 M-65 -20 h-17 M-65 4 h-17 M65 -44 h17 M65 -20 h17 M65 4 h17"/></g><text x="0" y="112" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Blackbox / logs</text><text x="0" y="141" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">Troubleshooting data</text></g><rect x="40" y="465" width="1020" height="105" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="63" y="501" font-family="Arial" font-size="21" fill="#ffd278" font-weight="700">Expectations</text><text x="63" y="533" font-family="Arial" font-size="19" fill="#fff">GPS is not a replacement for gyro stabilization and does not make every drone autonomous. Features depend on hardware and firmware configuration.</text></svg>