<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" fill="#fff" font-weight="700">PART 3 — MOTORS &amp; PROPELLERS</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">The motors spin; propellers push air to create thrust</text><g transform="translate(280 285)"><circle r="100" fill="#192c3e" stroke="#869fb2" stroke-width="9"/><circle r="73" fill="#293c4e" stroke="#edb24c" stroke-width="6"/><circle r="43" fill="#0d1d2b" stroke="#45d9ef" stroke-width="6"/><circle r="18" fill="#e9b54e"/><path d="M-40 -82 L-12 -45 M40 -82 L12 -45 M-40 82 L-12 45 M40 82 L12 45" stroke="#ff925e" stroke-width="7"/><text x="0" y="145" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Brushless motor</text><text x="0" y="174" text-anchor="middle" fill="#aeeefa" font-family="Arial" font-size="18">Stator • rotor bell • shaft</text></g><g transform="translate(780 275)"><path d="M0 -20 C-32 -55 -120 -105 -150 -70 C-177 -40 -89 -5 -20 5 C-85 37 -160 95 -124 126 C-92 154 -23 72 5 20 C38 94 98 152 128 120 C157 88 77 35 22 5 C91 -10 178 -41 150 -71 C120 -102 39 -55 0 -20Z" fill="#3f9ebc" stroke="#a9f4ff" stroke-width="4"/><circle r="26" fill="#162e42" stroke="#f5c35c" stroke-width="5"/><text x="0" y="175" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Propeller</text><text x="0" y="204" text-anchor="middle" fill="#aeeefa" font-family="Arial" font-size="18">Diameter • pitch • blade count</text></g><rect x="52" y="510" width="996" height="65" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="75" y="550" font-family="Arial" font-size="20" fill="#fff">CW + CCW groups balance reaction torque. Match motor, prop, battery and ESC; verify direction with props removed.</text></svg>