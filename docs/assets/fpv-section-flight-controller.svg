<g fill="#123b5b" font-size="24" font-weight="700"><text x="78" y="212">Gyro / IMU</text><text x="78" y="240" font-size="18" font-weight="400">Measures rotation / acceleration</text><text x="78" y="322">Barometer (optional)</text><text x="78" y="350" font-size="18" font-weight="400">Estimates altitude</text><text x="78" y="432">USB / configuration</text><text x="78" y="460" font-size="18" font-weight="400">Firmware and setup</text><text x="1037" y="212">Flash memory</text><text x="1037" y="240" font-size="18" font-weight="400">Stores settings / firmware</text><text x="1037" y="322">UARTs / peripherals</text><text x="1037" y="350" font-size="18" font-weight="400">Receiver, GPS, VTX, etc.</text><text x="1037" y="432">Power / BEC</text><text x="1037" y="460" font-size="18" font-weight="400">Regulated output rails</text><text x="1037" y="542">ESC / motor outputs</text><text x="1037" y="570" font-size="18" font-weight="400">Exact mapping is board-specific</text></g>
