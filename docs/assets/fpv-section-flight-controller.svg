<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Flight controller anatomy</title><desc id="desc">A conceptual board diagram labels the MCU, gyro/IMU, flash, OSD, UARTs, battery/power and motor connections.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#197bc0"/></marker></defs><rect width="1400" height="720" rx="28" fill="#f5f9fd"/><rect width="1400" height="100" rx="28" fill="#092b4c"/><rect y="72" width="1400" height="28" fill="#092b4c"/><text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">INSIDE A FLIGHT CONTROLLER</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Functional blocks — representative layout, not a pinout</text>
<g stroke-linecap="round" font-family="Arial,sans-serif">
<rect x="478" y="166" width="440" height="430" rx="28" fill="#152e45" stroke="#0a1724" stroke-width="8"/><rect x="528" y="215" width="340" height="330" rx="18" fill="#1f684b" stroke="#45a178" stroke-width="4"/>
