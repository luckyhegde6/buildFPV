<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — GPS / GNSS MODULE</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Receives satellite signals and passes position/speed data to supported FC firmware</text><g transform="translate(310 290)"><rect x="-130" y="-90" width="260" height="180" rx="14" fill="#bca15a" stroke="#fff" stroke-width="4"/><rect x="-82" y="-55" width="164" height="110" rx="12" fill="#1b5047" stroke="#51d8eb" stroke-width="4"/><circle r="36" fill="#d7c07b" stroke="#ecf1d3" stroke-width="4"/><circle r="17" fill="#183a37"/><path d="M-95 -90 l-20 -20 M95 -90 l20 -20" stroke="#b9c9d7" stroke-width="7"/><text x="0" y="135" text-anchor="middle" font-family="Arial" font-size="23" fill="#fff" font-weight="700">GPS/GNSS module</text></g><g transform="translate(760 185)" fill="none" stroke="#6ee7ff" stroke-width="4"><path d="M-100 0 L-45 -48 L15 -12 L90 -65"/><circle cx="-100" cy="0" r="18" fill="#f2be56"/><circle cx="-45" cy="-48" r="18" fill="#f2be56"/><circle cx="15" cy="-12" r="18" fill="#f2be56"/><circle cx="90" cy="-65" r="18" fill="#f2be56"/></g><g font-family="Arial"><text x="760" y="255" text-anchor="middle" font-size="22" fill="#6ee7ff">Satellite signals</text><path d="M440 290 H605" stroke="#6ee7ff" stroke-width="4"/><path d="M590 277 L605 290 L590 303" fill="none" stroke="#6ee7ff" stroke-width="4"/><rect x="610" y="280" width="390" height="110" rx="14" fill="#0a2137" stroke="#337ea0" stroke-width="2"/><text x="805" y="320" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Flight controller</text><text x="805" y="352" text-anchor="middle" font-size="18" fill="#aeeefa">UART/protocol → OSD/logging/rescue</text><rect x="45" y="495" width="1010" height="75" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="68" y="526" font-size="20" fill="#ffd278" font-weight="700">Important</text><text x="68" y="553" font-size="18" fill="#fff">GPS is slower navigation data, not the fast gyro stabilization loop. Verify voltage, wiring and firmware support.</text></g></svg>