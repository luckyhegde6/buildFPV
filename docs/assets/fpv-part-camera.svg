<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — FPV CAMERA</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">Captures the live view shown in compatible FPV goggles or a display</text><g transform="translate(360 295)"><rect x="-155" y="-105" width="310" height="210" rx="24" fill="#1b3448" stroke="#a8c0d1" stroke-width="5"/><rect x="-115" y="-65" width="130" height="130" rx="16" fill="#091a28" stroke="#51d8eb" stroke-width="5"/><circle cx="-50" cy="0" r="51" fill="#162d42" stroke="#6ee7ff" stroke-width="7"/><circle cx="-50" cy="0" r="29" fill="#07131e" stroke="#b2eff7" stroke-width="5"/><circle cx="-60" cy="-12" r="9" fill="#fff" opacity=".8"/><rect x="42" y="-70" width="80" height="35" rx="6" fill="#c69a3a"/><rect x="42" y="-20" width="80" height="35" rx="6" fill="#526a7c"/><rect x="42" y="30" width="80" height="35" rx="6" fill="#526a7c"/></g><g font-family="Arial"><path d="M310 205 L195 145" stroke="#6ee7ff" stroke-width="3"/><text x="50" y="137" font-size="22" fill="#6ee7ff">Lens</text><text x="50" y="165" font-size="18" fill="#fff">Focus and field of view</text><path d="M475 365 L620 420" stroke="#6ee7ff" stroke-width="3"/><text x="635" y="425" font-size="22" fill="#6ee7ff">Signal / power lead</text><text x="635" y="454" font-size="18" fill="#fff">Check the exact pinout</text><rect x="55" y="500" width="990" height="70" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="77" y="540" font-size="19" fill="#fff">Check voltage, connector, size, analog/digital system compatibility and camera mounting before connecting.</text></g></svg>