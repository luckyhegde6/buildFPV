<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">FPV antenna types: linear, circular polarized, patch and stubby</title><desc id="desc">Four large vector cards showing common FPV video antenna form factors and their typical coverage patterns.</desc>
<rect width="1400" height="660" rx="28" fill="#f4f9fd"/><rect width="1400" height="100" rx="28" fill="#0a2b4b"/><rect y="72" width="1400" height="28" fill="#0a2b4b"/>
<text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">FPV VIDEO ANTENNA TYPES</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Antenna form affects orientation, coverage and multipath handling</text>
<g font-family="Arial,sans-serif">
<g><rect x="36" y="130" width="320" height="470" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><text x="196" y="177" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">Linear / dipole</text><path d="M196 380 L196 260" stroke="#c59a4b" stroke-width="15" stroke-linecap="round"/><path d="M162 281 L162 240 M230 281 L230 240" stroke="#c59a4b" stroke-width="10" stroke-linecap="round"/><rect x="174" y="380" width="44" height="46" rx="8" fill="#2e465d"/><text x="60" y="470" font-size="22" fill="#294b67">• Simple and common</text><text x="60" y="505" font-size="22" fill="#294b67">• Broad coverage</text><text x="60" y="540" font-size="22" fill="#294b67">• Orientation matters</text></g>
<g><rect x="376" y="130" width="320" height="470" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><text x="536" y="177" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">Cloverleaf / RHCP-LHCP</text><path d="M536 400 L536 338" stroke="#c59a4b" stroke-width="12"/><g fill="none" stroke="#b78232" stroke-width="9"><ellipse cx="536" cy="290" rx="28" ry="65" transform="rotate(0 536 290)"/><ellipse cx="536" cy="290" rx="28" ry="65" transform="rotate(60 536 290)"/><ellipse cx="536" cy="290" rx="28" ry="65" transform="rotate(120 536 290)"/></g><text x="400" y="470" font-size="22" fill="#294b67">• Circular polarisation</text><text x="400" y="505" font-size="22" fill="#294b67">• Often helps with multipath</text><text x="400" y="540" font-size="22" fill="#294b67">• Match polarisation on both ends</text></g>
<g><rect x="716" y="130" width="320" height="470" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><text x="876" y="177" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">Patch / directional</text><path d="M837 266 L915 266 L934 342 L818 342 Z" fill="#283d53" stroke="#5d7388" stroke-width="5"/><path d="M842 292 L910 292 M838 312 L914 312" stroke="#e3bc5b" stroke-width="5"/><path d="M925 288 Q969 305 989 337 M925 272 Q985 302 1014 351" fill="none" stroke="#1684d8" stroke-width="6" stroke-linecap="round"/><text x="740" y="470" font-size="22" fill="#294b67">• Focused energy in one direction</text><text x="740" y="505" font-size="22" fill="#294b67">• Higher gain / narrower coverage</text><text x="740" y="540" font-size="22" fill="#294b67">• Needs correct aiming</text></g>
<g><rect x="1056" y="130" width="308" height="470" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/><text x="1210" y="177" text-anchor="middle" font-size="29" font-weight="700" fill="#123b5b">Stubby / omni</text><rect x="1176" y="260" width="68" height="100" rx="30" fill="#d72f48" stroke="#9e2035" stroke-width="5"/><rect x="1191" y="238" width="38" height="28" rx="8" fill="#202f42"/><rect x="1198" y="360" width="24" height="55" rx="5" fill="#c0a06b"/><path d="M1155 300 Q1115 335 1155 371 M1265 300 Q1305 335 1265 371" fill="none" stroke="#1684d8" stroke-width="6"/><text x="1080" y="470" font-size="22" fill="#294b67">• Compact, broad coverage</text><text x="1080" y="505" font-size="22" fill="#294b67">• Convenient for freestyle</text><text x="1080" y="540" font-size="22" fill="#294b67">• Performance varies by design</text></g>
<text x="48" y="634" font-size="18" fill="#607b90">These are representative shapes. Verify band, connector, polarisation and allowed RF settings for your exact video system.</text>
</g></svg>