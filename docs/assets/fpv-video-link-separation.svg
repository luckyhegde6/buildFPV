<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">FPV control, video and electrical power paths are separate</title>
<desc id="desc">Three horizontal diagrams show the control link from pilot radio through aircraft receiver to flight controller, the video link from camera through VTX and antenna to goggles, and the electrical power path from battery through ESC and regulators to components. The diagram is conceptual rather than a wiring pinout.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#17475c"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d7f1fb"/></marker></defs><rect width="1400" height="760" rx="26" fill="url(#bg)"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">THREE DIFFERENT PATHS IN AN FPV QUAD</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Control receiver (RX), video receiver (VRX) and electrical power are not the same system.</text>
<g font-family="Arial,sans-serif">
<rect x="40" y="120" width="1320" height="165" rx="18" fill="#142e46" stroke="#86efac" stroke-width="3"/><text x="68" y="153" font-size="23" font-weight="700" fill="#86efac">CONTROL LINK</text>
<g stroke="#d7f1fb" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M270 218 H340"/><path d="M545 218 H615"/><path d="M835 218 H905"/></g>
<g><rect x="70" y="178" width="200" height="80" rx="12" fill="#20433f" stroke="#86efac" stroke-width="2"/><rect x="340" y="178" width="205" height="80" rx="12" fill="#20433f" stroke="#86efac" stroke-width="2"/><rect x="615" y="178" width="220" height="80" rx="12" fill="#20433f" stroke="#86efac" stroke-width="2"/><rect x="905" y="178" width="310" height="80" rx="12" fill="#20433f" stroke="#86efac" stroke-width="2"/></g>
<g text-anchor="middle" font-size="20" fill="#fff"><text x="170" y="211">Radio transmitter</text><text x="170" y="238" font-size="16">pilot sticks</text><text x="442" y="211">Control RX</text><text x="442" y="238" font-size="16">e.g., ELRS</text><text x="725" y="211">Flight controller</text><text x="725" y="238" font-size="16">channels + sensors</text><text x="1060" y="211">ESC → motors</text><text x="1060" y="238" font-size="16">motor command outputs</text></g>
<rect x="40" y="310" width="1320" height="165" rx="18" fill="#142e46" stroke="#7dd3fc" stroke-width="3"/><text x="68" y="343" font-size="23" font-weight="700" fill="#7dd3fc">VIDEO LINK</text>
<g stroke="#d7f1fb" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M270 408 H340"/><path d="M545 408 H615"/><path d="M835 408 H905"/></g>
<g><rect x="70" y="368" width="200" height="80" rx="12" fill="#203c55" stroke="#7dd3fc" stroke-width="2"/><rect x="340" y="368" width="205" height="80" rx="12" fill="#203c55" stroke="#7dd3fc" stroke-width="2"/><rect x="615" y="368" width="220" height="80" rx="12" fill="#203c55" stroke="#7dd3fc" stroke-width="2"/><rect x="905" y="368" width="310" height="80" rx="12" fill="#203c55" stroke="#7dd3fc" stroke-width="2"/></g>
<g text-anchor="middle" font-size="20" fill="#fff"><text x="170" y="401">Camera</text><text x="170" y="428" font-size="16">sensor / lens</text><text x="442" y="401">VTX / air unit</text><text x="442" y="428" font-size="16">video transmitter</text><text x="725" y="401">Antenna / RF</text><text x="725" y="428" font-size="16">band and link</text><text x="1060" y="401">VRX / goggles</text><text x="1060" y="428" font-size="16">live picture / DVR</text></g>
<rect x="40" y="500" width="1320" height="165" rx="18" fill="#142e46" stroke="#fbd38d" stroke-width="3"/><text x="68" y="533" font-size="23" font-weight="700" fill="#fbd38d">POWER PATH (CONCEPTUAL)</text>
<g stroke="#d7f1fb" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M270 598 H340"/><path d="M545 598 H615"/><path d="M835 598 H905"/></g>
<g><rect x="70" y="558" width="200" height="80" rx="12" fill="#4a3921" stroke="#fbd38d" stroke-width="2"/><rect x="340" y="558" width="205" height="80" rx="12" fill="#4a3921" stroke="#fbd38d" stroke-width="2"/><rect x="615" y="558" width="220" height="80" rx="12" fill="#4a3921" stroke="#fbd38d" stroke-width="2"/><rect x="905" y="558" width="310" height="80" rx="12" fill="#4a3921" stroke="#fbd38d" stroke-width="2"/></g>
<g text-anchor="middle" font-size="20" fill="#fff"><text x="170" y="591">Battery</text><text x="170" y="618" font-size="16">exact chemistry / voltage</text><text x="442" y="591">Power distribution</text><text x="442" y="618" font-size="16">board / ESC input</text><text x="725" y="591">ESC / regulators</text><text x="725" y="618" font-size="16">voltage-specific rails</text><text x="1060" y="591">FC, motors, camera, VTX</text><text x="1060" y="618" font-size="16">each input range must match</text></g>
<text x="42" y="718" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Concept paths only. Exact pads, regulators, connector pinouts and motor order vary by board; use the hardware's official diagram.</text>
</g></svg>