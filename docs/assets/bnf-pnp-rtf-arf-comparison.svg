<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">BNF, PNP, ARF, RTF and DIY FPV package format comparison</title>
<desc id="desc">A conceptual table distinguishes aircraft package formats and shows that transmitter, goggles, battery, charger and receiver inclusions vary by product listing. Exact package contents must be checked per SKU.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#17465b"/></linearGradient></defs><rect width="1400" height="760" rx="26" fill="url(#bg)"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">BNF / PNP / ARF / RTF / DIY — PACKAGE CONTENTS</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Labels describe assembly and included gear—not a propeller size or flying style.</text>
<g font-family="Arial,sans-serif">
<rect x="34" y="118" width="1332" height="500" rx="16" fill="#132e46" stroke="#4b849d" stroke-width="2"/>
<g font-size="18" font-weight="700" fill="#fff"><text x="64" y="158">Format</text><text x="285" y="158">Aircraft assembly</text><text x="530" y="158">Control RX</text><text x="708" y="158">Radio</text><text x="850" y="158">Goggles/VRX</text><text x="1055" y="158">Battery/charger</text><text x="1260" y="158">Main caveat</text></g>
<g stroke="#3b6078" stroke-width="1"><path d="M52 176 H1348"/><path d="M52 257 H1348"/><path d="M52 338 H1348"/><path d="M52 419 H1348"/><path d="M52 500 H1348"/><path d="M52 581 H1348"/></g>
<g font-size="17" fill="#e5f3fb">
<text x="64" y="213" font-weight="700" fill="#7dd3fc">BNF</text><text x="285" y="211">Usually assembled</text><text x="530" y="211">Often included</text><text x="708" y="211">Usually no</text><text x="850" y="211">Usually no</text><text x="1055" y="211">Varies</text><text x="1260" y="202">Check RX protocol</text><text x="1260" y="224">and binding</text>
<text x="64" y="294" font-weight="700" fill="#86efac">PNP</text><text x="285" y="292">Usually assembled</text><text x="530" y="292">Often no</text><text x="708" y="292">No</text><text x="850" y="292">No</text><text x="1055" y="292">Varies</text><text x="1260" y="283">Inclusions vary</text><text x="1260" y="305">by maker</text>
<text x="64" y="375" font-weight="700" fill="#fbd38d">ARF / ARF+</text><text x="285" y="373">Partial / kit</text><text x="530" y="373">Varies</text><text x="708" y="373">Usually no</text><text x="850" y="373">No</text><text x="1055" y="373">Usually extra</text><text x="1260" y="364">Assembly/config</text><text x="1260" y="386">work remains</text>
<text x="64" y="456" font-weight="700" fill="#c4b5fd">RTF</text><text x="285" y="454">Usually assembled</text><text x="530" y="454">Usually included</text><text x="708" y="454">Usually included</text><text x="850" y="454">Often included</text><text x="1055" y="454">May include</text><text x="1260" y="445">Still inspect kit</text><text x="1260" y="467">contents/setup</text>
<text x="64" y="537" font-weight="700" fill="#fca5a5">DIY</text><text x="285" y="535">Builder assembles</text><text x="530" y="535">Builder selects</text><text x="708" y="535">Builder selects</text><text x="850" y="535">Builder selects</text><text x="1055" y="535">Builder selects</text><text x="1260" y="526">Requires fit,</text><text x="1260" y="548">tools and checks</text>
</g>
</g>
<rect x="40" y="648" width="1320" height="74" rx="16" fill="#0a2033" stroke="#fbd38d" stroke-width="2"/>
<text x="68" y="678" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fbd38d">Always inspect the exact SKU's “in the box” list.</text><text x="68" y="705" font-family="Arial,sans-serif" font-size="17" fill="#eaf6fc">BNF does not guarantee compatibility with your transmitter or goggles; product bundles differ.</text>
</svg>