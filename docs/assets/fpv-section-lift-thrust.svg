<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">How a quadcopter lifts and moves</title><desc id="desc">An enlarged conceptual illustration of propellers pushing air down, upward thrust, and climb, hover and descend conditions.</desc>
<defs><marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1684d8"/></marker><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#15945c"/></marker><marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d83b4f"/></marker></defs>
<rect width="1400" height="720" rx="28" fill="#f4f9fd"/><rect width="1400" height="100" rx="28" fill="#092b4c"/><rect y="72" width="1400" height="28" fill="#092b4c"/>
<text x="48" y="47" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">LIFT, THRUST &amp; AIRFLOW</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="21" fill="#bde6ff">Propellers accelerate air down; the reaction force pushes the aircraft up</text>
<g font-family="Arial,sans-serif">
<rect x="36" y="130" width="760" height="540" rx="22" fill="#fff" stroke="#c5d5e3" stroke-width="3"/>
<text x="416" y="175" font-size="30" font-weight="700" fill="#123b5b" text-anchor="middle">Side view: thrust in hover</text>
<!-- rotor motor and propeller -->
<rect x="280" y="318" width="270" height="70" rx="22" fill="#263e54" stroke="#0b1e30" stroke-width="6"/><rect x="320" y="296" width="190" height="30" rx="10" fill="#526f87"/><circle cx="415" cy="293" r="20" fill="#d8aa47" stroke="#89631d" stroke-width="4"/><path d="M415 273 L415 220" stroke="#465d73" stroke-width="8" stroke-linecap="round"/><ellipse cx="415" cy="211" rx="170" ry="20" fill="#b5cbdc" stroke="#6c8aa3" stroke-width="5"/><path d="M245 211 Q325 160 415 211 Q505 262 585 211" fill="none" stroke="#6c8aa3" stroke-width="5"/>
<!-- thrust up -->
<path d="M415 294 L415 218" stroke="#d83b4f" stroke-width="12" marker-end="url(#redArrow)"/><text x="456" y="265" font-size="25" font-weight="700" fill="#c42e44">Thrust / lift</text>
<!-- air down -->
<g stroke="#1684d8" stroke-width="8" stroke-linecap="round" marker-end="url(#blueArrow)"><path d="M320 405 L320 535"/><path d="M415 405 L415 558"/><path d="M510 405 L510 535"/></g><text x="415" y="602" text-anchor="middle" font-size="26" font-weight="700" fill="#126bb4">Air pushed downward</text>
<path d="M95 636 H730" stroke="#96b1c8" stroke-width="4" stroke-dasharray="14 9"/>
<!-- side explanation -->
<rect x="832" y="130" width="532" height="160" rx="22" fill="#e3f5eb" stroke="#abd9c0" stroke-width="3"/><text x="866" y="174" font-size="29" font-weight="700" fill="#13583a">Climb</text><text x="866" y="212" font-size="22" fill="#285c46">Total upward thrust exceeds weight.</text><path d="M1255 252 L1255 186" stroke="#15945c" stroke-width="9" marker-end="url(#greenArrow)"/>
<rect x="832" y="310" width="532" height="160" rx="22" fill="#e6f1fb" stroke="#aecfe6" stroke-width="3"/><text x="866" y="354" font-size="29" font-weight="700" fill="#14527d">Hover</text><text x="866" y="392" font-size="22" fill="#315874">Upward thrust balances the drone's weight.</text><path d="M1210 420 L1210 382" stroke="#1684d8" stroke-width="8" marker-end="url(#blueArrow)"/><path d="M1280 382 L1280 420" stroke="#1684d8" stroke-width="8" marker-end="url(#blueArrow)"/>
<rect x="832" y="490" width="532" height="180" rx="22" fill="#fff0e9" stroke="#ebc0ad" stroke-width="3"/><text x="866" y="534" font-size="29" font-weight="700" fill="#9b3d22">Descend</text><text x="866" y="572" font-size="22" fill="#744b3b">Thrust is less than the drone's weight.</text><path d="M1255 544 L1255 610" stroke="#d83b4f" stroke-width="9" marker-end="url(#redArrow)"/>
</g></svg>