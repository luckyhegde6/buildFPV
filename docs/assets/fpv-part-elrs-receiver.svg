<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6ee7ff"/></marker></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" fill="#fff" font-weight="700">PART 6 — RADIO &amp; CONTROL RECEIVER</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">The control link carries stick commands — not the video picture</text><g transform="translate(185 240)"><rect x="-95" y="-90" width="190" height="205" rx="22" fill="#202d3b" stroke="#b2c7d8" stroke-width="4"/><rect x="-48" y="-65" width="96" height="35" rx="5" fill="#6ee7ff"/><circle cx="-45" cy="8" r="29" fill="#101a25" stroke="#90a8bc" stroke-width="5"/><circle cx="45" cy="8" r="29" fill="#101a25" stroke="#90a8bc" stroke-width="5"/><rect x="-58" y="57" width="116" height="26" rx="5" fill="#455c70"/><text x="0" y="150" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Radio transmitter</text><text x="0" y="178" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">e.g. RadioMaster Pocket</text></g><g transform="translate(555 240)" stroke="#51d8eb" stroke-width="5" fill="none"><path d="M-55 -35 q-45 35 0 70 M-30 -55 q-65 55 0 110 M-5 -75 q-85 75 0 150"/></g><text x="555" y="365" fill="#aeeefa" font-family="Arial" font-size="20" text-anchor="middle">ELRS RF signal</text><path d="M650 240 H750" stroke="#6ee7ff" stroke-width="5" marker-end="url(#a)"/><g transform="translate(855 245)"><rect x="-90" y="-55" width="180" height="110" rx="12" fill="#20384d" stroke="#e7b34c" stroke-width="4"/><rect x="-42" y="-25" width="84" height="48" rx="4" fill="#d9a73f"/><path d="M-65 -55 l-18 -95 M65 -55 l18 -95" stroke="#6ee7ff" stroke-width="5"/><text x="0" y="93" fill="#fff" font-family="Arial" font-size="23" text-anchor="middle" font-weight="700">Receiver on quad</text><text x="0" y="120" fill="#aeeefa" font-family="Arial" font-size="18" text-anchor="middle">Channel data → FC</text></g><rect x="40" y="465" width="1020" height="105" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="63" y="501" font-family="Arial" font-size="21" fill="#ffd278" font-weight="700">Setup check</text><text x="63" y="533" font-family="Arial" font-size="19" fill="#fff">Verify matching band/firmware, receiver configuration, channel mapping and failsafe. Binding alone does not verify safe flight setup.</text></svg>