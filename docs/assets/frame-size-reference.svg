<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">FPV frame classes with verified model examples and nominal prop diameter</title>
<desc id="desc">Four top-view schematic quad frames for a 2.5 inch micro, 3.5 inch cinewhoop, 5 inch open prop frame and 7 inch long-range frame. Each shows example prop diameter and example diagonal wheelbase, explicitly marked as illustrative rather than drill templates.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#17445b"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse"><path d="M0,0 L9,3 L0,6 z" fill="#e3f6ff"/></marker></defs>
<rect width="1500" height="900" rx="28" fill="url(#bg)"/>
<text x="42" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">FRAME SIZE REFERENCE — DIMENSIONS ARE SEPARATE</text>
<text x="44" y="86" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Illustrative top-view silhouettes, not to scale and not manufacturing drawings. Model-specific specifications are cited in the associated guide; use actual dimensioned drawings for assembly.</text>
<!-- cards -->
<g font-family="Arial,sans-serif">
<!-- 2.5 -->
<g transform="translate(32 120)"><rect width="700" height="330" rx="18" fill="#152f4a" stroke="#5b91ad" stroke-width="2"/><text x="30" y="38" font-size="25" font-weight="700" fill="#7dd3fc">2.5-INCH MICRO — EXAMPLE</text>
<g transform="translate(210 183)" stroke="#829bac" stroke-width="22" stroke-linecap="round"><path d="M-75 -60 L75 60 M-75 60 L75 -60"/></g>
<g fill="#122033" stroke="#7dd3fc" stroke-width="4"><circle cx="135" cy="123" r="44"/><circle cx="285" cy="123" r="44"/><circle cx="135" cy="243" r="44"/><circle cx="285" cy="243" r="44"/></g><rect x="182" y="157" width="56" height="52" rx="8" fill="#e9b44c" stroke="#fff" stroke-width="2"/>
<path d="M135 294 V313 M285 294 V313 M135 306 H285" stroke="#e3f6ff" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/><text x="210" y="329" text-anchor="middle" font-size="16" fill="#e3f6ff">Sub250 OasisFly25 WB: 135 mm</text>
<path d="M85 123 H43 M43 123 V243 M43 243 H85" stroke="#e3f6ff" stroke-width="2"/><text x="35" y="185" transform="rotate(-90 35 185)" text-anchor="middle" font-size="15" fill="#e3f6ff">63.5 mm prop dia.</text>
<text x="390" y="104" font-size="18" fill="#fff">Nominal prop diameter: 2.5 in = 63.5 mm</text><text x="390" y="145" font-size="18" fill="#d7f0fd">OasisFly25 wheelbase: 135 mm</text><text x="390" y="188" font-size="16" fill="#c7f9ff">Check actual motor-to-motor diagonal</text><text x="390" y="216" font-size="16" fill="#c7f9ff">and prop clearance in the frame drawing.</text><text x="390" y="261" font-size="16" fill="#fbd38d">Sub250 OasisFly25 uses 2.5-inch props.</text></g>
<!-- 3.5 -->
<g transform="translate(768 120)"><rect width="700" height="330" rx="18" fill="#152f4a" stroke="#5b91ad" stroke-width="2"/><text x="30" y="38" font-size="25" font-weight="700" fill="#86efac">3.5-INCH CINEWHOOP — EXAMPLE</text>
<g transform="translate(210 183)" stroke="#829bac" stroke-width="23" stroke-linecap="round"><path d="M-75 -60 L75 60 M-75 60 L75 -60"/></g>
<g fill="#122033" stroke="#86efac" stroke-width="7"><circle cx="135" cy="123" r="47"/><circle cx="285" cy="123" r="47"/><circle cx="135" cy="243" r="47"/><circle cx="285" cy="243" r="47"/></g><rect x="182" y="157" width="56" height="52" rx="8" fill="#e9b44c" stroke="#fff" stroke-width="2"/>
<path d="M135 294 V313 M285 294 V313 M135 306 H285" stroke="#e3f6ff" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/><text x="210" y="329" text-anchor="middle" font-size="16" fill="#e3f6ff">Pavo35 wheelbase: 148 mm</text>
<path d="M80 123 H35 M35 123 V243 M35 243 H80" stroke="#e3f6ff" stroke-width="2"/><text x="27" y="185" transform="rotate(-90 27 185)" text-anchor="middle" font-size="15" fill="#e3f6ff">88.9 mm prop dia.</text>
<text x="390" y="104" font-size="18" fill="#fff">Nominal prop diameter: 3.5 in = 88.9 mm</text><text x="390" y="145" font-size="18" fill="#d7f0fd">Pavo35 example WB: 148 mm</text><text x="390" y="188" font-size="16" fill="#c7f9ff">Duct OD exceeds prop diameter;</text><text x="390" y="216" font-size="16" fill="#c7f9ff">actual guard/frame dimension varies.</text><text x="390" y="261" font-size="16" fill="#fbd38d">Pavo35 uses D90S-3 props (90 mm).</text></g>
<!-- 5 -->
<g transform="translate(32 480)"><rect width="700" height="330" rx="18" fill="#152f4a" stroke="#5b91ad" stroke-width="2"/><text x="30" y="38" font-size="25" font-weight="700" fill="#fbad92">5-INCH OPEN-PROP — EXAMPLE</text>
<g transform="translate(210 183)" stroke="#829bac" stroke-width="25" stroke-linecap="round"><path d="M-95 -76 L95 76 M-95 76 L95 -76"/></g>
<g fill="#122033" stroke="#fbad92" stroke-width="4"><circle cx="115" cy="107" r="54"/><circle cx="305" cy="107" r="54"/><circle cx="115" cy="259" r="54"/><circle cx="305" cy="259" r="54"/></g><rect x="181" y="157" width="58" height="52" rx="8" fill="#e9b44c" stroke="#fff" stroke-width="2"/>
<path d="M115 317 V337 M305 317 V337 M115 330 H305" stroke="#e3f6ff" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/><text x="210" y="353" text-anchor="middle" font-size="16" fill="#e3f6ff">MK5X: 225 mm / MK5D: 230 mm</text>
<path d="M55 107 H25 M25 107 V259 M25 259 H55" stroke="#e3f6ff" stroke-width="2"/><text x="17" y="183" transform="rotate(-90 17 183)" text-anchor="middle" font-size="15" fill="#e3f6ff">127 mm prop dia.</text>
<text x="390" y="104" font-size="18" fill="#fff">Nominal prop diameter: 5 in = 127 mm</text><text x="390" y="145" font-size="18" fill="#d7f0fd">GEPRC MK5X 225 mm / MK5D 230 mm</text><text x="390" y="188" font-size="16" fill="#c7f9ff">Check prop-to-prop and frame clearance,</text><text x="390" y="216" font-size="16" fill="#c7f9ff">battery strap path and camera cage fit.</text><text x="390" y="261" font-size="16" fill="#fbd38d">GEPRC model-specific specs; see linked guides.</text></g>
<!-- 7 -->
<g transform="translate(768 480)"><rect width="700" height="330" rx="18" fill="#152f4a" stroke="#5b91ad" stroke-width="2"/><text x="30" y="38" font-size="25" font-weight="700" fill="#c8b5ff">7-INCH LONG-RANGE — EXAMPLE</text>
<g transform="translate(210 183)" stroke="#829bac" stroke-width="27" stroke-linecap="round"><path d="M-112 -88 L112 88 M-112 88 L112 -88"/></g>
<g fill="#122033" stroke="#c8b5ff" stroke-width="4"><circle cx="98" cy="95" r="62"/><circle cx="322" cy="95" r="62"/><circle cx="98" cy="271" r="62"/><circle cx="322" cy="271" r="62"/></g><rect x="181" y="157" width="58" height="52" rx="8" fill="#e9b44c" stroke="#fff" stroke-width="2"/>
<path d="M98 342 V360 M322 342 V360 M98 353 H322" stroke="#e3f6ff" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/><text x="210" y="378" text-anchor="middle" font-size="16" fill="#e3f6ff">AOS 7 V5 wheelbase: 313 mm</text>
<path d="M30 95 H12 M12 95 V271 M12 271 H30" stroke="#e3f6ff" stroke-width="2"/><text x="7" y="183" transform="rotate(-90 7 183)" text-anchor="middle" font-size="15" fill="#e3f6ff">177.8 mm prop dia.</text>
<text x="390" y="104" font-size="18" fill="#fff">Nominal prop diameter: 7 in = 177.8 mm</text><text x="390" y="145" font-size="18" fill="#d7f0fd">iFlight AOS 7 V5 wheelbase: 313 mm</text><text x="390" y="188" font-size="16" fill="#c7f9ff">Prioritise efficiency, battery retention,</text><text x="390" y="216" font-size="16" fill="#c7f9ff">RF/GNSS placement and recovery planning.</text><text x="390" y="261" font-size="16" fill="#fbd38d">iFlight AOS 7 V5 example; not a universal value.</text></g>
</g>
<text x="750" y="868" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c7f9ff">Model examples shown: Sub250 OasisFly25, BETAFPV Pavo35, GEPRC MK5X/MK5D, iFlight AOS 7 V5. Dimensions are from model-specific listings; never use this drawing to drill or choose fasteners.</text>
</svg>