<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071a2e"/><stop offset="1" stop-color="#16466a"/></linearGradient></defs><rect width="1100" height="620" rx="24" fill="url(#b)"/><text x="40" y="58" font-family="Arial" font-size="36" font-weight="700" fill="#fff">PART — PROPELLER ANATOMY</text><text x="40" y="91" font-family="Arial" font-size="19" fill="#aeeefa">A propeller converts motor rotation into thrust by accelerating air</text><g transform="translate(390 290)"><path d="M0 -34 C-20 -65 -58 -220 -110 -195 C-165 -170 -80 -70 -32 -20 C-68 10 -205 70 -165 120 C-130 160 -35 72 5 35 C35 90 105 205 150 160 C190 120 80 35 35 5 C85 -22 225 -70 195 -120 C165 -165 65 -70 0 -34Z" fill="#41a8c4" stroke="#b2f2ff" stroke-width="5"/><circle r="37" fill="#192e40" stroke="#f3c05b" stroke-width="6"/><circle r="12" fill="#f3c05b"/><path d="M36 -30 L142 -142" stroke="#ffd278" stroke-width="3"/><text x="155" y="-155" font-family="Arial" font-size="22" fill="#ffd278">Leading edge</text><path d="M35 25 L166 87" stroke="#6ee7ff" stroke-width="3"/><text x="176" y="96" font-family="Arial" font-size="22" fill="#6ee7ff">Trailing edge</text><path d="M-15 -35 L-95 -100" stroke="#7af2c2" stroke-width="3"/><text x="-275" y="-110" font-family="Arial" font-size="22" fill="#7af2c2">Blade</text></g><g font-family="Arial"><rect x="690" y="150" width="350" height="335" rx="16" fill="#0a2137" stroke="#337ea0" stroke-width="2"/><text x="720" y="193" font-size="24" fill="#fff" font-weight="700">How to read a prop</text><text x="720" y="238" font-size="20" fill="#ffd278">Diameter</text><text x="720" y="264" font-size="18" fill="#fff">Overall tip-to-tip size.</text><text x="720" y="310" font-size="20" fill="#6ee7ff">Pitch</text><text x="720" y="336" font-size="18" fill="#fff">Approximate distance the</text><text x="720" y="360" font-size="18" fill="#fff">prop would advance per turn.</text><text x="720" y="405" font-size="20" fill="#7af2c2">Blade count</text><text x="720" y="431" font-size="18" fill="#fff">Affects response, load and</text><text x="720" y="455" font-size="18" fill="#fff">current draw with motor/prop.</text></g><rect x="40" y="520" width="1020" height="58" rx="12" fill="#091c2f" stroke="#2e7899"/><text x="62" y="556" font-family="Arial" font-size="19" fill="#fff">Safety: install the correct CW/CCW propellers only after bench setup; remove props for motor testing.</text></svg>